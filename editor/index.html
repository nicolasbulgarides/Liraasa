<script>
  'use strict';

  /* =====================================================================
     Liraasa Songbook — a journal for writing songs and speeches.

     Everything runs in this file against the bundle in liraasa-data.js.
     Nothing is sent anywhere; the songbook lives in this browser.

     Rules come from the lexicon's own `grammar`, `morphology` and `phonology`
     blocks and from the Grammar Guide, not from guesswork:
       - the seven forms and the verb rule
       - lexicon-first parsing, never blind suffix stripping
       - the 20-slot clause template and its 13 exclusions
       - penultimate stress; hiatus vowels are separate syllables

     The Compose tab is an **assisted composer**, not a translator. It finds
     candidate words through the English synonym and gloss index and assembles
     them in clause-template order. Every word it offers is a real lexicon
     entry; where English has no Liraasa equivalent it says so rather than
     inventing one.
     ===================================================================== */

  const D = window.LIRAASA;

  /* The grammar checker (editor/checker/*.js, built from the LLM reference
     JSON). The page still opens if it failed to load, and says so. */
  const CK = (window.LiraasaChecker && window.LiraasaChecker.default) || null;
  const CK_ERROR = (window.LiraasaChecker && window.LiraasaChecker.loadError) || null;
  const SEV_RANK = { error: 0, warn: 1, note: 2, unsettled: 3 };
  const SEV_LABEL = { error: 'Error', warn: 'Warning', note: 'Note', unsettled: 'Unsettled' };
  const VOWELS = 'aeiou';
  const SLOT_NAME = ['R', 'R+asa', 'R+na', 'VERB', 'R+nasan', 'R+san', 'R+asasan'];
  const SUFFIX = ['', 'asa', 'na', null, 'nasan', 'san', 'asasan'];

  /* ----------------------------------------------------------- morphology */

  function verbOf(root) {
    if (root === 'opi') return 'opioa';
    const f = root[0];
    if (f === 'n') return root + 'nia';
    if (f === 's') return root + 'sia';
    if (VOWELS.includes(f)) return root + 'a';
    return root + f + 'a';
  }

  const formsOf = (root) => SUFFIX.map((s, i) => (i === 3 ? verbOf(root) : root + s));

  /* ------------------------------------------------------------ phonetics */

  const PHONE = {
    a: 'a',
    e: 'e',
    i: 'i',
    o: 'o',
    u: 'u',
    l: 'l',
    m: 'm',
    n: 'n',
    r: 'r',
    s: 's',
    v: 'v',
    y: 'j',
    b: 'b',
    d: 'd',
    p: 'p',
    t: 't',
    g: 'ɡ',
    h: 'h',
    z: 'z',
    k: 'k',
    c: 'k',
    f: 'f',
    j: 'd͡ʒ',
  };
  const DIGRAPH = { sh: 'ʃ', ch: 't͡ʃ' };

  function toPhones(word) {
    const w = word.toLowerCase();
    const out = [];
    for (let i = 0; i < w.length; ) {
      const pair = w.slice(i, i + 2);
      if (DIGRAPH[pair]) {
        out.push(DIGRAPH[pair]);
        i += 2;
        continue;
      }
      const ch = w.charAt(i);
      i += 1;
      if (PHONE[ch]) out.push(PHONE[ch]);
    }
    return out;
  }

  /** Every vowel is a nucleus; a medial cluster splits between consonants. */
  function syllabify(word) {
    const w = word.toLowerCase();
    const units = [];
    for (let i = 0; i < w.length; ) {
      const pair = w.slice(i, i + 2);
      if (DIGRAPH[pair]) {
        units.push({ v: false, t: pair });
        i += 2;
        continue;
      }
      const ch = w.charAt(i);
      i += 1;
      if (PHONE[ch]) units.push({ v: VOWELS.includes(ch), t: ch });
    }
    const sy = [];
    let onset = [];
    for (const u of units) {
      if (!u.v) {
        onset.push(u.t);
        continue;
      }
      if (sy.length && onset.length > 1) {
        sy[sy.length - 1] += onset.slice(0, -1).join('');
        onset = onset.slice(-1);
      }
      sy.push(onset.join('') + u.t);
      onset = [];
    }
    if (onset.length) {
      if (!sy.length) return { syllables: [], stress: 0 };
      sy[sy.length - 1] += onset.join('');
    }
    return { syllables: sy, stress: sy.length <= 1 ? 0 : sy.length - 2 };
  }

  const syllableCount = (w) => syllabify(w).syllables.length;

  /* ---------------------------------------------------------- the index */

  const H = new Map();
  const FORM = new Map();
  const DERIV = new Map();
  const CLOSED = new Map();
  /** English phrase -> candidate Liraasa words. Built for the composer. */
  const EN = new Map();

  function pushForm(sp, ref) {
    const l = FORM.get(sp);
    if (l) l.push(ref);
    else FORM.set(sp, [ref]);
  }

  const enKey = (phrase) =>
    String(phrase)
      .trim()
      .toLowerCase()
      .replace(/^(a|an|the|to)\s+/, '');

  function addEn(phrase, cand) {
    const key = enKey(phrase);
    if (key.length < 2 || key.length > 42) return;
    const l = EN.get(key);
    if (l) {
      if (!l.some((c) => c.word === cand.word)) l.push(cand);
    } else {
      EN.set(key, [cand]);
    }
  }

  /** Split a gloss into its separate senses, the way the lexicon writes them.
      A parenthetical is a gloss's note, so "Society (Mind of Place)" also
      stands as "Society". */
  const senses = (g) =>
    String(g)
      .split(/[;,]/)
      .flatMap((s) => [s.trim(), s.replace(/\s*\(.*?\)/g, '').trim()])
      .filter((s, i, all) => s.length > 1 && all.indexOf(s) === i);

  (function buildIndex() {
    for (const [root, type, components, glosses, register, dIx, synonyms, since] of D.headwords) {
      const rec = {
        root,
        type,
        components: components || null,
        glosses,
        register,
        domain: D.domains[dIx],
        synonyms,
        since,
        forms: formsOf(root),
      };
      H.set(root, rec);
      rec.forms.forEach((f, slot) => pushForm(f, { root, slot }));
      for (const d of ['yo', 'vu', 'pago']) {
        if (root === 'mavo' && d === 'pago') continue; // blocked by morphology
        DERIV.set(root + d, { root, suffix: d });
      }
      // The English index: every glossed slot and every synonym. The synonym
      // list mixes the senses of all seven forms, so a synonym that is already
      // a slot's gloss stays with that slot: "shimmering" is sizosan, not sizo.
      const glossed = new Set();
      glosses.forEach((g, slot) => {
        if (!g) return;
        for (const s of senses(g)) {
          glossed.add(enKey(s));
          addEn(s, { word: rec.forms[slot], root, slot, kind: 'lexical' });
        }
      });
      for (const syn of synonyms) {
        if (glossed.has(enKey(syn))) continue;
        addEn(syn, { word: root, root, slot: 0, kind: 'lexical', synonym: true });
      }
    }

    const closed = (rows, kind, fIx, gIx) => {
      for (const r of rows) {
        const form = r[fIx];
        if (!form || form.includes(' ') || form.startsWith('-')) continue;
        if (!CLOSED.has(form)) CLOSED.set(form, { kind, gloss: r[gIx] || '' });
        for (const s of String(r[gIx] || '').split(/[;,/]/)) {
          addEn(s.replace(/\(.*?\)/g, ''), { word: form, kind });
        }
      }
    };
    closed(D.functionWords, 'function word', 0, 1);
    closed(D.correlatives, 'correlative', 0, 3);
    closed(D.timeWords, 'time word', 0, 1);
    closed(D.particles, 'particle', 0, 1);
    for (const [form, person, number] of D.pronouns) {
      CLOSED.set(form, { kind: 'pronoun', gloss: person + ' ' + number });
    }
    for (const [base, family] of D.colors) {
      CLOSED.set(base, { kind: 'colour', gloss: family.toLowerCase() });
      addEn(family, { word: base, kind: 'colour' });
      for (const m of ['narvo', 'bio', 'juba', 'lumi']) {
        CLOSED.set(base + m, { kind: 'colour', gloss: family.toLowerCase() + ' · ' + m });
      }
    }
    for (const v of Object.values(D.numbers)) CLOSED.set(v, { kind: 'numeral', gloss: '' });
    for (const [n, v] of Object.entries(D.numbers)) addEn(n, { word: v, kind: 'numeral' });
  })();

  const NAMES = new Set(D.names.map((n) => n.toLowerCase()));
  const NUMERALS = new Set(Object.values(D.numbers));
  const knownStem = (s) => FORM.has(s) || DERIV.has(s) || CLOSED.has(s);

  /* ---------------------------------------------------------- the parser
     Lexicon-first: many roots end in letters that look like suffixes (navu,
     sevu, trana, pago), so a known spelling always beats a decomposition. */

  function parseWord(raw) {
    const w = raw.toLowerCase();
    if (!w) return null;
    if (FORM.has(w)) return { kind: 'lexical', refs: FORM.get(w), suffixes: [], stem: w };

    const c = CLOSED.get(w);
    if (c) return { kind: c.kind, gloss: c.gloss, stem: w, suffixes: [] };

    let body = w;
    let ordinal = false;
    if (body.endsWith('-ne')) {
      body = body.slice(0, -3);
      ordinal = true;
    }
    const parts = body.split('-');
    if (parts.length && parts.every((p) => NUMERALS.has(p))) {
      return { kind: 'numeral', stem: w, suffixes: [], gloss: ordinal ? 'ordinal' : '' };
    }

    if (DERIV.has(w))
      return { kind: 'derivation', derivation: DERIV.get(w), suffixes: [], stem: w };

    let stem = w;
    const sfx = [];
    if (stem.endsWith('ri') && stem.length > 4) {
      stem = stem.slice(0, -2);
      sfx.unshift('-ri');
      if (!knownStem(stem) && stem.endsWith('ti') && stem.length > 4) {
        const inner = stem.slice(0, -2);
        if (knownStem(inner)) {
          stem = inner;
          sfx.unshift('-ti');
        }
      }
    } else if (stem.endsWith('ti') && stem.length > 4) {
      stem = stem.slice(0, -2);
      sfx.unshift('-ti');
    }
    if (sfx.length) {
      if (FORM.has(stem)) return { kind: 'lexical', refs: FORM.get(stem), suffixes: sfx, stem };
      if (DERIV.has(stem))
        return { kind: 'derivation', derivation: DERIV.get(stem), suffixes: sfx, stem };
      const c2 = CLOSED.get(stem);
      if (c2) return { kind: c2.kind, gloss: c2.gloss, suffixes: sfx, stem };
    }

    for (const p of D.motionPrefixes) {
      if (w.startsWith(p)) {
        const rest = w.slice(p.length);
        const refs = (FORM.get(rest) || []).filter((r) => r.slot === 3);
        if (refs.length) return { kind: 'motion', prefix: p, refs, stem: rest, suffixes: [] };
      }
    }

    if (w.includes('-de-')) {
      const [l, r] = w.split('-de-');
      if (NUMERALS.has(l) && NUMERALS.has(r)) return { kind: 'fraction', stem: w, suffixes: [] };
    }

    if (D.legacy[w]) return { kind: 'legacy', to: D.legacy[w], stem: w, suffixes: [] };
    if (NAMES.has(w) || /^[A-Z]/.test(raw)) return { kind: 'name', stem: raw, suffixes: [] };
    return null;
  }

  function glossFor(p) {
    if (!p) return '?';
    if (p.kind === 'lexical' || p.kind === 'motion') {
      const ref = p.refs[0];
      const g = H.get(ref.root).glosses[ref.slot];
      return (p.prefix ? p.prefix + ' ' : '') + (g || '(' + SLOT_NAME[ref.slot] + ', unused)');
    }
    if (p.kind === 'derivation') {
      const map = { yo: 'one who', vu: 'great', pago: 'place of' };
      return (
        map[p.derivation.suffix] + ' ' + (H.get(p.derivation.root).glosses[0] || p.derivation.root)
      );
    }
    if (p.kind === 'legacy') return 'pre-1.0 → ' + p.to;
    if (p.kind === 'name') return 'name';
    return p.gloss || p.kind;
  }

  function segFor(p) {
    if (!p) return '';
    const s = (p.suffixes || []).join('');
    if (p.kind === 'lexical') {
      const ref = p.refs[0];
      const rec = H.get(ref.root);
      const base = rec.components ? rec.components.join('+') : ref.root;
      const slot =
        ref.slot === 0 ? '' : '-' + SLOT_NAME[ref.slot].replace('R+', '').replace('VERB', 'v');
      return base + slot + s;
    }
    if (p.kind === 'derivation') return p.derivation.root + '-' + p.derivation.suffix + s;
    if (p.kind === 'motion') return p.prefix + p.refs[0].root + '-v';
    return p.kind + s;
  }

  /* --------------------------------------------------- clause checking */

  const RANK = {};
  const slotRow = (name) => D.grammar.slots.find((s) => s[1] === name) || [0, 0, []];
  for (const [n, name] of [
    [4, 'TENSE'],
    [5, 'REALITY'],
    [7, 'MODAL'],
    [8, 'APPROACH'],
    [9, 'PHASE'],
    [10, 'EFFORT'],
    [11, 'ASPECT'],
    [12, 'ITERATION'],
    [13, 'EVIDENTIAL'],
  ]) {
    for (const w of slotRow(name)[2]) RANK[w] = n;
  }
  const ATT = new Set(slotRow('ATTITUDE')[2]);
  const COPULA = new Set(['ke', 'ka', 'kapoki', 'loya', 'miyo']);
  const TENSE = new Set(slotRow('TENSE')[2]);
  // FRAME also lists "time words" and "correlatives of time": descriptions, not words.
  const FRAME_OPS = new Set(slotRow('FRAME')[2].filter((w) => !w.includes(' ')));
  const NOUN_SLOTS = [0, 1, 2];
  /* Each noun form's own adjective: root → -san, -asa → -asasan, -na → -nasan.
     lordina (chaos) describes with lordinasan, never lordisan. */
  const ADJ_OF_NOUN = { 0: 5, 1: 6, 2: 4 };
  /** The adjective a noun reading turns into: { form, gloss, slot }. Gloss is '' if unused. */
  const adjectiveOf = (ref) => {
    const h = H.get(ref.root);
    const slot = ADJ_OF_NOUN[ref.slot];
    return { form: h.forms[slot], gloss: h.glosses[slot] || '', slot };
  };

  function tokenize(text) {
    const out = [];
    const re = /[A-Za-z][A-Za-z'-]*/g;
    let m;
    while ((m = re.exec(text))) {
      const t = m[0].replace(/^[-']+|[-']+$/g, '');
      if (t) out.push(t);
    }
    return out;
  }

  const isVerb = (w, p) =>
    COPULA.has(w) ||
    (p && (p.kind === 'motion' || (p.kind === 'lexical' && p.refs.some((r) => r.slot === 3))));

  const PRONOUN_EN = {
    i: 'maivo',
    me: 'maivo',
    my: 'maivo',
    mine: 'maivo',
    you: 'taivo',
    your: 'taivo',
    yours: 'taivo',
    he: 'saivo',
    him: 'saivo',
    his: 'saivo',
    she: 'saivo',
    her: 'saivo',
    hers: 'saivo',
    it: 'ito',
    its: 'ito',
    we: 'maivori',
    us: 'maivori',
    our: 'maivori',
    they: 'saivori',
    them: 'saivori',
    their: 'saivori',
  };
  const POSSESSIVE = new Set(['my', 'your', 'his', 'her', 'its', 'our', 'their']);

  /* English grammar markers → the particle and the slot it belongs in. Each
     marker becomes a row of its own in the breakdown, so nothing the grammar
     adds is hidden. `verb` marks an English verb ("began") that stands in for
     a real verb when its clause has no other. */
  const MARKERS = [
    { en: ['will', 'shall'], word: 'futu', slot: 'TENSE' },
    // "was" and "were" are po plus a copula; composeClause adds both.
    { en: ['did', 'had', 'ago'], word: 'po', slot: 'TENSE' },
    { en: ['can', 'could', 'able to'], word: 'povi', slot: 'MODAL' },
    { en: ['might', 'maybe', 'possibly'], word: 'nosi', slot: 'MODAL' },
    { en: ['may', 'allowed to', 'permitted'], word: 'dagi', slot: 'MODAL' },
    { en: ['must', 'have to', 'has to', 'need to'], word: 'musi', slot: 'MODAL' },
    { en: ['should'], word: 'suvi', slot: 'MODAL' },
    { en: ['hope to', 'hopes to', 'hoped to'], word: 'kopi', slot: 'MODAL' },
    { en: ['would'], word: 'viki', slot: 'MODAL' },
    { en: ['almost', 'nearly'], word: 'tavki', slot: 'APPROACH' },
    { en: ['about to'], word: 'fututi', slot: 'APPROACH' },
    {
      en: ['began to', 'begin to', 'begins to', 'started to', 'start to', 'starts to'],
      word: 'hiro',
      slot: 'PHASE',
    },
    {
      en: ['began', 'begin', 'begins', 'started', 'start'],
      word: 'hiro',
      slot: 'PHASE',
      verb: true,
    },
    { en: ['stopped', 'stop', 'ceased'], word: 'teki', slot: 'PHASE', verb: true },
    { en: ['tried to', 'try to', 'tries to'], word: 'telvo', slot: 'EFFORT' },
    { en: ['managed to', 'succeeded'], word: 'vazdi', slot: 'EFFORT' },
    { en: ['again'], word: 'reve', slot: 'ITERATION' },
    { en: ['still', 'keeps', 'keep on'], word: 'loki', slot: 'ITERATION' },
    { en: ['already'], word: 'bodu', slot: 'ITERATION' },
    { en: ['suddenly'], word: 'zafra', slot: 'FRAME' },
    { en: ['finally', 'at last'], word: 'finra', slot: 'FRAME' },
    { en: ['eventually'], word: 'lanto', slot: 'FRAME' },
    { en: ['at once', 'immediately'], word: 'kenvi', slot: 'FRAME' },
    { en: ['certainly', 'surely', 'indeed'], word: 'seye', slot: 'ATTITUDE' },
    { en: ['perhaps'], word: 'poye', slot: 'ATTITUDE' },
    { en: ['only'], word: 'doli', slot: 'SCOPE' },
    { en: ['also', 'too'], word: 'tu', slot: 'SCOPE' },
    { en: ['even'], word: 'yesta', slot: 'SCOPE' },
  ].map((m) => ({ ...m, phrases: m.en.map((p) => p.split(' ')) }));

  /* Negative words → ne, plus the marker a contraction carries with it:
     "can't" is povi and ne, "didn't" is po and ne. */
  const NEGATIVE = {
    not: null,
    never: null,
    no: null,
    "don't": null,
    "doesn't": null,
    cannot: 'can',
    "can't": 'can',
    "couldn't": 'could',
    "didn't": 'did',
    "won't": 'will',
    "wouldn't": 'would',
    "shouldn't": 'should',
  };

  /* English words that open a new clause, as the checker's clause reset does
     for their Liraasa equivalents. "that" opens one only when a subject
     follows it ("I know that you sing"), not as a determiner ("that song"). */
  const CLAUSE_OPENERS = new Set([
    'when',
    'because',
    'if',
    'who',
    'which',
    'and',
    'but',
    'that+rel',
    'that+obj',
    'for+to',
    'to+verb',
  ]);
  /* Openers whose clause has no subject of its own: the relative's head noun,
     or the main clause's subject, fills it. */
  const NO_SUBJECT = new Set(['who', 'which', 'that+rel', 'to+verb']);
  /* Tokens rewriteEnglish coins, shown as the English the writer typed. */
  const DISPLAY = {
    'that+rel': 'that',
    'that+obj': 'that',
    'that+dem': 'that',
    'for+to': 'for … to',
    'to+verb': 'to',
  };

  /* Words carried by Liraasa grammar rather than by a dictionary entry. */
  const STRUCTURAL = {
    the: 'li',
    a: 'baba',
    an: 'baba',
    of: 'de',
    in: 'en',
    inside: 'en',
    to: 'ala',
    toward: 'ala',
    with: 'ko',
    using: 'yuta',
    from: 'da',
    and: 'ata',
    but: 'nara',
    because: 'kasa',
    when: 'kube',
    if: 'si',
    that: 'fime',
    'that+rel': 'raho',
    'that+obj': 'raho',
    'that+dem': 'ola',
    'for+to': 'kopisa',
    'to+verb': 'sidu',
    who: 'raho',
    which: 'raho',
    all: 'toda',
    every: 'toda',
    many: 'muya',
    this: 'eli',
    there: 'ola-pago',
    here: 'eli-pago',
    now: 'eli-krono',
    always: 'toda-krono',
    never: 'nuna-krono',
    nothing: 'nuna-coda',
    everyone: 'toda-nela',
    someone: 'somi-nela',
    'no one': 'nuna-nela',
    why: 'ki-kasa',
    how: 'ki-modo',
    where: 'ki-pago',
    what: 'ki-coda',
    who_q: 'ki-nela',
  };

  /* English "to be" is a copula in Liraasa, not a word to drop. `ke` is the
     temporary state, `ka` the enduring one; both are offered. */
  const COPULA_EN = {
    is: 'ke',
    are: 'ke',
    am: 'ke',
    be: 'ke',
    being: 'ke',
    was: 'ke',
    were: 'ke',
    been: 'ke',
  };
  const COPULA_ALTS = ['ke', 'ka', 'kapoki', 'loya', 'miyo'];

  /* Irregular pasts and participles, so "came" can find venreva. */
  const IRREGULAR = {
    came: 'come',
    went: 'go',
    gone: 'go',
    done: 'do',
    saw: 'see',
    seen: 'see',
    sang: 'sing',
    sung: 'sing',
    began: 'begin',
    begun: 'begin',
    had: 'have',
    said: 'say',
    made: 'make',
    took: 'take',
    taken: 'take',
    gave: 'give',
    given: 'give',
    knew: 'know',
    known: 'know',
    felt: 'feel',
    told: 'tell',
    left: 'leave',
    found: 'find',
    heard: 'hear',
    held: 'hold',
    kept: 'keep',
    slept: 'sleep',
    spoke: 'speak',
    spoken: 'speak',
    stood: 'stand',
    understood: 'understand',
    wrote: 'write',
    written: 'write',
    ate: 'eat',
    eaten: 'eat',
    fell: 'fall',
    fallen: 'fall',
    ran: 'run',
    sat: 'sit',
    lost: 'lose',
    won: 'win',
    brought: 'bring',
    bought: 'buy',
    thought: 'think',
    caught: 'catch',
    taught: 'teach',
    built: 'build',
    sent: 'send',
    spent: 'spend',
    rose: 'rise',
    risen: 'rise',
    grew: 'grow',
    grown: 'grow',
    drew: 'draw',
    threw: 'throw',
    wore: 'wear',
    broke: 'break',
    broken: 'break',
    chose: 'choose',
    chosen: 'choose',
    shone: 'shine',
  };

  const STOPWORDS = new Set(['do', 'does', 'own']);

  /* Simple pasts, as opposed to participles. Seeing one means the clause is
     past, so it takes `po` — the author's corpus writes "Toda-nela po venreva
     sabri Dorin", not "Toda-nela venreva". */
  const IRREGULAR_PAST = new Set([
    'came',
    'went',
    'saw',
    'sang',
    'began',
    'had',
    'said',
    'made',
    'took',
    'gave',
    'knew',
    'felt',
    'told',
    'left',
    'found',
    'heard',
    'held',
    'kept',
    'slept',
    'spoke',
    'stood',
    'understood',
    'wrote',
    'ate',
    'fell',
    'ran',
    'sat',
    'lost',
    'won',
    'brought',
    'bought',
    'thought',
    'caught',
    'taught',
    'built',
    'sent',
    'spent',
    'rose',
    'grew',
    'drew',
    'threw',
    'wore',
    'broke',
    'chose',
    'shone',
    'was',
    'were',
  ]);

  /* Words after which the next content word is a noun, never the verb. */
  const DETERMINER_EN = new Set([
    'the',
    'a',
    'an',
    'this',
    'that',
    'these',
    'those',
    'my',
    'your',
    'his',
    'her',
    'its',
    'our',
    'their',
    'every',
    'all',
    'many',
    'some',
    'no',
  ]);

  function lemmas(word) {
    const w = word.toLowerCase();
    const out = [w];
    if (IRREGULAR[w]) out.push(IRREGULAR[w]);
    if (w.endsWith('ies') && w.length > 4) out.push(w.slice(0, -3) + 'y');
    if (w.endsWith('es') && w.length > 3) out.push(w.slice(0, -2));
    if (w.endsWith('s') && w.length > 3) out.push(w.slice(0, -1));
    if (w.endsWith('ed') && w.length > 4) {
      out.push(w.slice(0, -2), w.slice(0, -1));
      if (w.length > 5 && w[w.length - 3] === w[w.length - 4]) out.push(w.slice(0, -3));
    }
    if (w.endsWith('ing') && w.length > 5) {
      out.push(w.slice(0, -3), w.slice(0, -3) + 'e');
      if (w[w.length - 4] === w[w.length - 5]) out.push(w.slice(0, -4));
    }
    return [...new Set(out)];
  }

  /* Function words bound to a clause position — tense, modals, frames,
     clause-final attitude — come from MARKERS, never from a word lookup:
     "hope" is not pifu, which only closes a clause. */
  const positional = (c) =>
    c.kind === 'function word' &&
    (RANK[c.word] !== undefined || ATT.has(c.word) || FRAME_OPS.has(c.word));

  /** Candidates for one English chunk, best first. */
  function lookupEnglish(chunk) {
    const seen = new Map();
    const take = (list, bonus, loose) => {
      for (const c of list || []) {
        if (positional(c)) continue;
        const key = c.word;
        const score =
          (c.kind === 'lexical' ? 10 : 20) + bonus - (c.slot || 0) - (c.synonym ? 5 : 0);
        if (!seen.has(key) || seen.get(key).score < score)
          seen.set(key, loose ? { ...c, score, loose: true } : { ...c, score });
      }
    };
    take(EN.get(chunk), 100);
    for (const l of lemmas(chunk)) if (l !== chunk) take(EN.get(l), 60);
    take(EN.get('to ' + chunk), 80);
    take(EN.get('be ' + chunk), 80); // "born" is kronobioka, glossed "to be born"
    if (seen.size === 0 && chunk.length > 3) {
      // A loose pass: an indexed phrase holding this word whole. These are only
      // near matches ("once" is in kenvi's "at once"), so none is chosen for
      // the writer; they are offered beside the gap.
      const whole = new RegExp('\\b' + chunk + '\\b');
      let n = 0;
      for (const [phrase, list] of EN) {
        if (n > 400) break;
        if (whole.test(phrase) && phrase.length < chunk.length + 14) {
          take(list, 10, true);
          n += 1;
        }
      }
    }
    return [...seen.values()].sort((a, b) => b.score - a.score).slice(0, 6);
  }

  const PRONOUN_GLOSS = new Map(
    D.pronouns.map(([form, person, number]) => [form, person + ' ' + number]),
  );
  const isPastEn = (w) => IRREGULAR_PAST.has(w) || /[a-z]{3}ed$/.test(w);
  const particle = (word, slotName) => ({ word, kind: 'particle', slotName });
  const glossOf = (word) => (CLOSED.get(word) || {}).gloss || '';

  /** One sentence's English as words, with commas kept as clause hints. */
  const englishTokens = (s) =>
    s
      .toLowerCase()
      .replace(/[‘’]/g, "'")
      .match(/[a-z]+(?:['-][a-z]+)*|,/g) || [];

  /** The marker a run of tokens starts with, longest phrase first. */
  function markerAt(tokens, i) {
    let best = null;
    for (const m of MARKERS) {
      for (const p of m.phrases) {
        if (p.every((w, k) => tokens[i + k] === w) && (!best || p.length > best.len)) {
          best = { m, len: p.length };
        }
      }
    }
    return best;
  }

  const opensClause = (tokens, i) =>
    CLAUSE_OPENERS.has(tokens[i]) ||
    (tokens[i] === 'that' &&
      (Boolean(PRONOUN_EN[tokens[i + 1]]) || ['the', 'a', 'an'].includes(tokens[i + 1])));

  const SUBJECT_EN = new Set(['i', 'you', 'he', 'she', 'it', 'we', 'they']);

  /** Can this English word be a verb: a glossed verb slot, or a copula? */
  const verbish = (w) =>
    Boolean(w) &&
    w !== ',' &&
    !DETERMINER_EN.has(w) &&
    !STRUCTURAL[w] &&
    !PRONOUN_EN[w] &&
    (Boolean(COPULA_EN[w]) ||
      lookupEnglish(w).some(
        (o) => (o.kind === 'lexical' && o.slot === 3 && !o.loose) || COPULA.has(o.word),
      ));

  /** Does a marker phrase ending in "to" ("hope to", "began to") end at j? */
  const markerEndsAt = (t, j) =>
    MARKERS.some((m) =>
      m.phrases.some(
        (p) =>
          p.length > 1 &&
          p[p.length - 1] === 'to' &&
          p.every((w, k) => t[j - p.length + 1 + k] === w),
      ),
    );

  /* English word order and English function words, rewritten to the Liraasa
     structures they stand for before the clauses are split. Each rewrite is a
     token DISPLAY shows as the English typed, so the rows stay readable. */
  function rewriteEnglish(tokens, question) {
    const t = [...tokens];
    // A question keeps statement order and adds ki: "am I …?" is "I am … ki".
    if (question) {
      const s = ['or', 'and', 'but'].includes(t[0]) ? 1 : 0;
      if (COPULA_EN[t[s]] && SUBJECT_EN.has(t[s + 1])) [t[s], t[s + 1]] = [t[s + 1], t[s]];
    }
    let verbSeen = false;
    let detAt = -1;
    for (let i = 0; i < t.length; i += 1) {
      const [prev, w, next] = [t[i - 1], t[i], t[i + 1]];
      if (w === 'that') {
        if ((i === 0 || prev === 'now' || prev === ',') && COPULA_EN[next]) {
          t[i] = 'that+dem'; // "that is a holy light": the demonstrative, ola
        } else if (
          i > 0 &&
          !DETERMINER_EN.has(next) &&
          !PRONOUN_EN[next] &&
          (isPastEn(next || '') || verbish(next))
        ) {
          t[i] = 'that+rel'; // "the tool that created": a relative, raho
        }
      } else if (w === 'to' && verbish(next) && !markerEndsAt(t, i)) {
        // "for the stars to hear" is a purpose clause; any other "to" + verb chains with sidu.
        const f = t.lastIndexOf('for', i);
        if (f >= 0 && t.slice(f + 1, i).every((x) => x !== ',' && !CLAUSE_OPENERS.has(x))) {
          t[f] = 'for+to';
          t.splice(i, 1);
          i -= 1;
          continue;
        }
        t[i] = 'to+verb';
      } else if (
        SUBJECT_EN.has(w) &&
        verbSeen &&
        detAt >= 0 &&
        i - detAt <= 4 &&
        prev &&
        !STRUCTURAL[prev] &&
        !PRONOUN_EN[prev] &&
        !COPULA_EN[prev]
      ) {
        // "a holy light we hope to become": English drops the relative marker.
        t.splice(i, 0, 'that+obj');
        i += 1;
      }
      if (COPULA_EN[t[i]] || isPastEn(t[i])) verbSeen = true;
      if (DETERMINER_EN.has(t[i]) && verbSeen) detAt = i;
      if (t[i] === ',' || CLAUSE_OPENERS.has(t[i])) {
        verbSeen = false;
        detAt = -1;
      }
    }
    return t;
  }

  /* Split before a clause opener, and at the comma that closes a leading
     subordinate clause: "When time began, I heard your voice" is two clauses,
     each with its own subject, verb and operators. */
  function splitEnglishClauses(tokens) {
    const words = [];
    const commaBefore = new Set();
    for (const t of tokens) {
      if (t === ',') commaBefore.add(words.length);
      else words.push(t);
    }
    const clauses = [];
    let cur = [];
    const close = (comma) => {
      if (cur.length) clauses.push({ tokens: cur, comma });
      cur = [];
    };
    words.forEach((w, i) => {
      const comma = commaBefore.has(i);
      const subordinate =
        cur.length && CLAUSE_OPENERS.has(cur[0]) && !['and', 'but'].includes(cur[0]);
      if (cur.length && (opensClause(words, i) || (comma && subordinate))) close(comma);
      cur.push(w);
    });
    close(false);
    return clauses;
  }

  /** Build one clause's chunks: a row per English word, markers included. */
  function composeClause(tokens, sole) {
    const chunks = [];
    let negated = false;
    const markerChunk = (en, m) => ({
      en,
      role: 'grammar',
      marker: m,
      options: [particle(m.word, m.slot)],
      chosen: 0,
      note: glossOf(m.word),
    });

    for (let i = 0; i < tokens.length; ) {
      const hit = markerAt(tokens, i);
      if (hit) {
        chunks.push(markerChunk(tokens.slice(i, i + hit.len).join(' '), hit.m));
        i += hit.len;
        continue;
      }
      const w = tokens[i];
      const afterDeterminer = i > 0 && DETERMINER_EN.has(tokens[i - 1]);
      i += 1;
      if (Object.hasOwn(NEGATIVE, w)) {
        negated = true;
        chunks.push({
          en: w,
          role: 'grammar',
          negation: true,
          options: [particle('ne', 'NEGATION')],
          chosen: 0,
          note: glossOf('ne'),
        });
        const carried = NEGATIVE[w] && markerAt([NEGATIVE[w]], 0);
        if (carried) chunks.push(markerChunk(w, carried.m));
        continue;
      }
      if (STOPWORDS.has(w)) continue;
      if (POSSESSIVE.has(w)) {
        const owner = PRONOUN_EN[w];
        chunks.push({
          en: w,
          role: 'possessor',
          options: [{ word: owner, kind: 'pronoun' }],
          chosen: 0,
          after: 'de',
          note:
            owner +
            ' = ' +
            (PRONOUN_GLOSS.get(owner) || 'pronoun') +
            ' · de marks possession: owner + de + possessed noun',
        });
        continue;
      }
      if (PRONOUN_EN[w]) {
        chunks.push({
          en: w,
          role: 'pronoun',
          options: [{ word: PRONOUN_EN[w], kind: 'pronoun' }],
          chosen: 0,
        });
        continue;
      }
      if (STRUCTURAL[w]) {
        chunks.push({
          en: DISPLAY[w] || w,
          tok: w,
          role: 'structure',
          options: [{ word: STRUCTURAL[w], kind: 'function word' }],
          chosen: 0,
          note: glossOf(STRUCTURAL[w]),
        });
        continue;
      }
      if (COPULA_EN[w]) {
        // "was" is the past of a copula: po, then ke or ka. Without the
        // copula, po has no verb and drifts to the end of the clause.
        if (w === 'was' || w === 'were') {
          chunks.push({ ...markerChunk(w, { word: 'po', slot: 'TENSE' }), note: glossOf('po') });
        }
        chunks.push({
          en: w,
          role: 'copula',
          options: COPULA_ALTS.map((x) => ({ word: x, kind: 'copula' })),
          chosen: 0,
          isVerb: true,
        });
        continue;
      }
      const options = lookupEnglish(w);
      const isPlural = /[a-z]{3}s$/.test(w) && !w.endsWith('ss');
      // Near matches only: offered, never chosen. The line shows the gap.
      const loose = options.length > 0 && options.every((o) => o.loose);
      chunks.push({
        en: w,
        role: loose ? 'near' : options.length ? 'word' : 'gap',
        options,
        chosen: loose ? -1 : 0,
        nounish: afterDeterminer,
        plural: Boolean(!loose && isPlural && options.length && options[0].slot === 0),
        ...(loose
          ? { note: 'no exact match; these only contain the word. Pick one only if it fits.' }
          : {}),
        // "become" is loya, a copula: it fills the verb slot.
        ...(!loose && options[0] && COPULA.has(options[0].word) ? { isVerb: true } : {}),
      });
    }

    /* "was born": English passive of a verb Liraasa glosses "to be born".
       The verb itself carries it, so the copula goes: po kronobioka. */
    for (let i = chunks.length - 2; i >= 0; i -= 1) {
      const n = chunks[i + 1];
      if (chunks[i].role !== 'copula' || n.role !== 'word') continue;
      const at = n.options.findIndex(
        (o) =>
          o.kind === 'lexical' && o.slot === 3 && /^to be /i.test(H.get(o.root).glosses[3] || ''),
      );
      if (at < 0) continue;
      Object.assign(n, { chosen: at, isVerb: true, role: 'verb', plural: false });
      chunks.splice(i, 1);
    }

    /* Choose the verb. English puts it after the subject, and a word used as a
       verb takes the verb form, not the root: "I love you" wants amora, not
       amor. Promote the first candidate offering a glossed verb slot — the
       index holds only slots that carry a meaning, so this can never pick an
       unused one. Every alternative stays one click away. */
    const standIn = chunks.findIndex((c) => c.marker && c.marker.verb);
    if (!chunks.some((c) => c.isVerb)) {
      const content = [];
      chunks.forEach((c, i) => {
        if (c.role !== 'structure' && c.role !== 'grammar') content.push(i);
      });
      // The first content word is the subject, unless it is a one-word command
      // or the clause is a relative ("who holds") or a chained "to hear".
      // "and felt shame" shares the subject before "and", so its first word is the verb.
      const shared =
        ['and', 'but'].includes(chunks[0]?.tok) &&
        content[0] !== undefined &&
        chunks[content[0]].role === 'word' &&
        !chunks[content[0]].nounish &&
        verbish(chunks[content[0]].en);
      const subject =
        NO_SUBJECT.has(chunks[0]?.tok) || shared || (content.length === 1 && sole && standIn < 0)
          ? -1
          : content[0];
      // A word whose best reading is a verb wins over one that merely has a
      // verb form: in "the old stars hear", velu has veluva but hear is lenila.
      const verbAt = (c, best) =>
        best
          ? c.options[0]?.kind === 'lexical' && c.options[0].slot === 3 && !c.options[0].loose
            ? 0
            : -1
          : c.options.findIndex((o) => o.kind === 'lexical' && o.slot === 3 && !o.loose);
      for (const best of [true, false]) {
        const i = content.find(
          (j) => j !== subject && !chunks[j].nounish && verbAt(chunks[j], best) >= 0,
        );
        if (i === undefined) continue;
        const c = chunks[i];
        c.chosen = verbAt(c, best);
        c.isVerb = true;
        c.role = 'verb';
        c.plural = false; // "works" is third person, not a plural
        break;
      }
    }

    /* A noun does not modify a noun (ADR-0011): of two nouns side by side the
       first becomes its -san adjective, "phoenix love" is farulavrasan amor.
       An unused -san slot is never used; the pair is left for the checker. */
    for (let i = 0; i + 1 < chunks.length; i += 1) {
      const [a, b] = [chunks[i], chunks[i + 1]];
      const [oa, ob] = [a.options[a.chosen], b.options[b.chosen]];
      if (
        a.role !== 'word' ||
        b.role !== 'word' ||
        oa?.kind !== 'lexical' ||
        ob?.kind !== 'lexical'
      )
        continue;
      if (!NOUN_SLOTS.includes(oa.slot) || !NOUN_SLOTS.includes(ob.slot)) continue;
      const adj = adjectiveOf(oa);
      if (!adj.gloss) continue;
      let at = a.options.findIndex((o) => o.word === adj.form);
      if (at < 0)
        at = a.options.push({ word: adj.form, root: oa.root, slot: adj.slot, kind: 'lexical' }) - 1;
      a.chosen = at;
      a.plural = false;
      a.note =
        'a noun does not modify a noun: ' +
        oa.word +
        ' becomes ' +
        adj.form +
        ' (' +
        adj.gloss +
        ')';
    }

    /* "Time began": no verb follows "began", so `hiro` (begin to) would have
       nothing to scope over. The English verb is then the clause's verb,
       found in the lexicon like any other; the particle stays one click away. */
    if (!chunks.some((c) => c.isVerb) && standIn >= 0) {
      const c = chunks[standIn];
      const verbs = lookupEnglish(c.en).filter((o) => o.kind === 'lexical' && o.slot === 3);
      if (verbs.length) {
        const m = c.marker;
        c.options = [...verbs, ...c.options];
        c.chosen = 0;
        c.isVerb = true;
        c.role = 'verb';
        c.marker = null;
        c.note =
          'no verb follows “' +
          c.en +
          '”, so it is the verb here; ' +
          m.word +
          ' (' +
          glossOf(m.word) +
          ') needs a verb after it';
      }
    }

    /* A past-tense content word puts the clause in the past, so it takes `po`
       — the author's corpus writes "Toda-nela po venreva sabri Dorin", not
       "Toda-nela venreva". Shown as its own row, beside the word that set it.
       A past marker counts too: "began to" is hiro, and still past. */
    if (!chunks.some((c) => c.marker && c.marker.slot === 'TENSE')) {
      const at = chunks.findIndex((c) => !c.negation && isPastEn(c.en.split(' ')[0]));
      if (at >= 0) {
        chunks.splice(at, 0, {
          en: chunks[at].en,
          role: 'grammar',
          marker: { word: 'po', slot: 'TENSE' },
          options: [particle('po', 'TENSE')],
          chosen: 0,
          note: 'English past tense, so po goes before the verb',
        });
      }
    }

    return { chunks, negated };
  }

  /** Build a draft for one English sentence: one entry per clause. */
  function composeSentence(sentence) {
    const raw = sentence.trim();
    const question = /\?\s*$/.test(raw);
    const split = splitEnglishClauses(rewriteEnglish(englishTokens(raw), question));
    const clauses = split.map((c) => ({
      ...composeClause(c.tokens, split.length === 1),
      comma: c.comma,
    }));
    return { raw, clauses, question };
  }

  const PRE_ORDER = [
    'FRAME',
    'TENSE',
    'REALITY',
    'MODAL',
    'APPROACH',
    'PHASE',
    'EFFORT',
    'ASPECT',
    'ITERATION',
    'EVIDENTIAL',
  ];

  /** One clause's current choices as Liraasa parts. */
  function clauseLine(k) {
    const marks = k.chunks.filter((c) => c.marker).map((c) => c.marker);
    const pre = marks
      .filter((m) => PRE_ORDER.includes(m.slot))
      .sort((a, b) => PRE_ORDER.indexOf(a.slot) - PRE_ORDER.indexOf(b.slot));
    const frame = pre.filter((m) => m.slot === 'FRAME').map((m) => m.word);
    const preverbal = pre.filter((m) => m.slot !== 'FRAME').map((m) => m.word);
    const scope = marks.filter((m) => m.slot === 'SCOPE').map((m) => m.word);
    const attitude = marks.filter((m) => m.slot === 'ATTITUDE').map((m) => m.word);

    /* The preverbal stack, in slot order: tense, then ne, then the rest.
       `ne` follows the tense (1.0:G1) — "Maivo po ne lirala", never
       "Maivo ne po lirala". */
    const stack = [];
    stack.push(...preverbal.filter((w) => RANK[w] === 4));
    if (k.negated) stack.push('ne');
    stack.push(...preverbal.filter((w) => RANK[w] !== 4));

    const verbAt = k.chunks.findIndex((c) => c.isVerb);
    const parts = [];
    // A clause opener (kube, kasa, si…) comes before the clause's own frame.
    const first = k.chunks[0];
    const lead =
      first && first.role === 'structure' && (CLAUSE_OPENERS.has(first.tok) || first.tok === 'that')
        ? 1
        : 0;

    const emit = (c, i) => {
      if (!placed && verbAt >= 0 && i === verbAt) {
        for (const w of stack) parts.push({ text: w });
        placed = true;
      }
      if (c.role === 'grammar') return; // carried by the stack, frame or scope
      if (c.role === 'gap' || c.chosen < 0) {
        parts.push({ gap: true, text: c.en });
        return;
      }
      const opt = c.options[c.chosen];
      if (!opt) return;
      parts.push({ text: opt.word + (c.plural ? 'ri' : '') });
      if (c.after) parts.push({ text: c.after });
    };

    let placed = stack.length === 0;
    k.chunks.slice(0, lead).forEach(emit);
    for (const w of frame) parts.push({ text: w });
    if (frame.length) parts.push({ text: ',', tight: true });
    for (const w of scope) parts.push({ text: w });
    k.chunks.forEach((c, i) => {
      if (i >= lead) emit(c, i);
    });
    // No verb was identified, so the operators go at the end rather than
    // disappearing; the writer can move them.
    if (!placed) for (const w of stack) parts.push({ text: w });
    for (const t of attitude) parts.push({ text: t });
    return parts;
  }

  /** Render a draft's current choices as a Liraasa line. */
  function draftLine(d) {
    const parts = [];
    d.clauses.forEach((k, i) => {
      parts.push(...clauseLine(k));
      if (k.comma && i < d.clauses.length - 1) parts.push({ text: ',', tight: true });
    });
    if (d.question) parts.push({ text: 'ki' });
    return parts;
  }

  const draftText = (d) =>
    draftLine(d)
      .map((p) => p.text)
      .join(' ')
      .replace(/\s+,/g, ',')
      .trim() + (d.question ? '?' : '.');

  let drafts = [];

  function runCompose() {
    const src = els.englishIn.value.trim();
    if (!src) {
      els.composeOut.innerHTML =
        '<p class="empty" style="margin-top:var(--s3)">Write an English line or two and press Compose. ' +
        'Every word offered is a real lexicon entry — where Liraasa has no word for something, it says so ' +
        'rather than inventing one.</p>';
      return;
    }
    drafts = src
      .split(/\n+/)
      .map((l) => l.trim())
      .filter(Boolean)
      .flatMap((l) => l.split(/(?<=[.!?])\s+/).filter(Boolean))
      .map(composeSentence);
    renderCompose();
  }

  function optLabel(c, o) {
    let label = esc(o.word) + (c.after ? ' ' + esc(c.after) : '');
    if (o.kind === 'lexical' && o.slot)
      label += '<span class="sl">' + SLOT_NAME[o.slot] + '</span>';
    if (o.kind === 'particle') label += '<span class="sl">' + esc(o.slotName) + '</span>';
    return label;
  }

  function chunkRow(c, di, ki, ci) {
    if (c.role === 'gap') {
      return (
        '<div class="chunk"><span class="en">' +
        esc(c.en) +
        '<span class="role">no match</span></span>' +
        '<span class="nomatch">Liraasa has no word for this. Build a MODIFIER+HEAD compound ' +
        'from two roots, or rephrase.</span></div>'
      );
    }
    const opts = c.options
      .map(
        (o, oi) =>
          '<button class="opt" type="button" aria-pressed="' +
          (oi === c.chosen) +
          '" data-d="' +
          di +
          '" data-k="' +
          ki +
          '" data-c="' +
          ci +
          '" data-o="' +
          oi +
          '">' +
          optLabel(c, o) +
          '</button>',
      )
      .join('');
    return (
      '<div class="chunk"><span class="en">' +
      esc(c.en) +
      '<span class="role">' +
      esc(c.role) +
      '</span></span>' +
      '<span class="opts">' +
      opts +
      (c.note ? '<span class="cnote">' + esc(c.note) + '</span>' : '') +
      '</span></div>'
    );
  }

  function renderCompose() {
    els.composeOut.innerHTML = drafts
      .map((d, di) => {
        const line = draftLine(d)
          .map((p) => (p.gap ? '<span class="gap">⟨' + esc(p.text) + '⟩</span>' : esc(p.text)))
          .join(' ')
          .replace(/\s+,/g, ',');
        const rows = d.clauses
          .map(
            (k, ki) =>
              (d.clauses.length > 1
                ? '<div class="clause-sep label">clause ' + (ki + 1) + '</div>'
                : '') + k.chunks.map((c, ci) => chunkRow(c, di, ki, ci)).join(''),
          )
          .join('');
        return (
          '<div class="draft">' +
          '<div class="label">' +
          esc(d.raw) +
          '</div>' +
          '<div class="out" style="margin-top:4px">' +
          line +
          '</div>' +
          '<div class="chunks">' +
          rows +
          '</div>' +
          '<button class="btn" type="button" data-insert-draft="' +
          di +
          '" style="margin-top:var(--s2)">' +
          'Insert this line</button>' +
          '</div>'
        );
      })
      .join('');
  }

  /** Carry each line's English through an edit of the page. Lines before and
      after the edit keep theirs; a line edited in place keeps its own; a new
      line has none; a deleted line takes its English with it. */
  function realignEnglish(before, after, english) {
    let a = 0;
    while (a < before.length && a < after.length && before[a] === after[a]) a += 1;
    let b = 0;
    while (
      b < before.length - a &&
      b < after.length - a &&
      before[before.length - 1 - b] === after[after.length - 1 - b]
    ) {
      b += 1;
    }
    const removed = before.length - a - b;
    const added = after.length - a - b;
    return after.map((_, i) => {
      if (i < a) return english[i] || '';
      if (i < a + added) return i - a < removed ? english[i] || '' : '';
      return english[i - after.length + before.length] || '';
    });
  }

  /* ---------------------------------------------------------- songbook
     Pure helpers for what the store does with whole pieces: deleting one,
     and typesetting pieces as printed pages. */

  const esc = (s) =>
    String(s).replace(
      /[&<>"]/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
    );

  /** Deleting a piece is forever, so the writer types this to confirm it. */
  const FOREVER = '[FOREVER]';
  const confirmsDelete = (typed) => String(typed).trim() === FOREVER;

  /** Each line's English, by position; older pieces kept it by line text. */
  const englishOf = (p) =>
    p.text
      .split('\n')
      .map(
        (l, i) => (p.englishLines && p.englishLines[i]) || (p.english && p.english[l.trim()]) || '',
      );

  /** Remove a piece and return the id to open next: the most recent piece on
      the same shelf, then anywhere. The songbook is never left empty. */
  function removePiece(book, id, blank) {
    const gone = book.pieces.find((p) => p.id === id);
    if (!gone) return book.activeId;
    book.pieces = book.pieces.filter((p) => p.id !== id);
    const recent = (list) => [...list].sort((a, b) => b.updated.localeCompare(a.updated))[0];
    const next =
      recent(book.pieces.filter((p) => p.collectionId === gone.collectionId)) ||
      recent(book.pieces);
    if (next) return next.id;
    const fresh = blank(gone.collectionId);
    book.pieces.push(fresh);
    return fresh.id;
  }

  /** A piece's stanzas: blank lines divide them; each line pairs with its English. */
  function stanzasOf(p) {
    const english = englishOf(p);
    const out = [];
    let cur = [];
    p.text.split('\n').forEach((line, i) => {
      if (!line.trim()) {
        if (cur.length) out.push(cur);
        cur = [];
      } else cur.push({ liraasa: line.trim(), english: (english[i] || '').trim() });
    });
    if (cur.length) out.push(cur);
    return out;
  }

  const PRINT_CSS = `
  @page {
    size: A5;
    margin: 20mm 17mm 22mm;
    @bottom-center {
      content: counter(page);
      font: 8pt 'Work Sans', sans-serif;
      color: #8a8f98;
    }
  }
  @page :first {
    @bottom-center { content: none; }
  }
  html { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  body {
    margin: 0;
    background: #fff;
    color: #1c2026;
    font-family: 'EB Garamond', 'Iowan Old Style', Palatino, Georgia, serif;
    font-variant-numeric: oldstyle-nums;
  }
  .sans { font-family: 'Work Sans', ui-sans-serif, system-ui, sans-serif; }
  .kicker {
    font-size: 7pt; letter-spacing: 0.24em; text-transform: uppercase; color: #b0564f;
  }
  .meta {
    font-size: 7pt; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8f98;
  }
  .rule { width: 16mm; border: 0; border-top: 0.6pt solid #b0564f; margin: 5mm auto 0; }

  .cover { height: 150mm; display: flex; flex-direction: column; justify-content: center;
    text-align: center; break-after: page; }
  .cover h1 { font-weight: 500; font-size: 30pt; margin: 4mm 0 3mm; letter-spacing: 0.01em; }
  .contents { break-after: page; }
  .contents h2 { font-weight: 500; font-size: 15pt; margin: 0 0 6mm; text-align: center; }
  .contents ol { list-style: none; margin: 0; padding: 0; }
  .contents li { display: flex; align-items: baseline; gap: 3mm; padding: 1.6mm 0;
    border-bottom: 0.4pt solid #e4e1d6; font-size: 11.5pt; }
  .contents li .meta { margin-left: auto; letter-spacing: 0.08em; }

  .piece + .piece { break-before: page; }
  .head { text-align: center; margin: 4mm 0 10mm; }
  .head h1 { font-weight: 500; font-size: 22pt; line-height: 1.1; margin: 2.5mm 0 2mm; }
  .stanza { margin: 0 0 7mm; }
  .pair { break-inside: avoid; margin: 0 0 3mm; }
  .liraasa { font-size: 12.5pt; line-height: 1.28; margin: 0; }
  /* A long line wraps under a hanging indent, level with its English. */
  .pair .liraasa { padding-left: 6mm; text-indent: -6mm; }
  .english { font-style: italic; font-size: 9.5pt; line-height: 1.3; color: #595f68;
    margin: 0.7mm 0 0 6mm; }
  .empty { text-align: center; color: #8a8f98; font-style: italic; }
  `;

  /** Pieces as a printable HTML document: each Liraasa line with its English
      beneath, stanza by stanza, a piece to a page run. More than one piece
      gets a title page and contents. Spelling is never altered for display. */
  function songbookHtml(pieces, { collections, edition, title }) {
    const shelf = (p) => collections.get(p.collectionId) || '';
    const label = (p) =>
      [p.kind, p.register].filter(Boolean).map(esc).join('<span aria-hidden="true"> · </span>');
    const many = pieces.length > 1;

    const front = many
      ? '<section class="cover"><div class="kicker sans">Liraasa ' +
        esc(edition) +
        '</div><h1>' +
        esc(title) +
        '</h1><div class="meta sans">' +
        pieces.length +
        ' pieces</div><hr class="rule" /></section>' +
        '<section class="contents"><h2>Contents</h2><ol>' +
        pieces
          .map(
            (p) =>
              '<li><span class="liraasa" lang="art-x-liraasa">' +
              esc(p.title || 'Untitled') +
              '</span><span class="meta sans">' +
              esc(shelf(p)) +
              '</span></li>',
          )
          .join('') +
        '</ol></section>'
      : '';

    const body = pieces
      .map((p) => {
        const stanzas = stanzasOf(p);
        return (
          '<section class="piece"><header class="head"><div class="kicker sans">' +
          esc(shelf(p) || 'Liraasa ' + edition) +
          '</div><h1 class="liraasa" lang="art-x-liraasa">' +
          esc(p.title || 'Untitled') +
          '</h1><div class="meta sans">' +
          label(p) +
          '</div><hr class="rule" /></header>' +
          (stanzas.length
            ? stanzas
                .map(
                  (st) =>
                    '<div class="stanza">' +
                    st
                      .map(
                        (l) =>
                          '<div class="pair"><p class="liraasa" lang="art-x-liraasa">' +
                          esc(l.liraasa) +
                          '</p>' +
                          (l.english
                            ? '<p class="english" lang="en">' + esc(l.english) + '</p>'
                            : '') +
                          '</div>',
                      )
                      .join('') +
                    '</div>',
                )
                .join('')
            : '<p class="empty">This piece has no lines yet.</p>') +
          '</section>'
        );
      })
      .join('');

    return (
      '<!doctype html><html lang="en"><head><meta charset="utf-8" /><title>' +
      esc(title) +
      '</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500&display=swap" />' +
      '<style>' +
      PRINT_CSS +
      '</style></head><body>' +
      front +
      body +
      '</body></html>'
    );
  }

  /* ------------------------------------------------------------- store */

  const KEY = 'liraasa-songbook-v2';
  const OLD_KEY = 'liraasa-songwright-v1';
  const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  let store = null;

  function blankPiece(collectionId, title) {
    const now = new Date().toISOString();
    return {
      id: uid(),
      collectionId,
      title: title || 'Untitled',
      kind: 'song',
      register: 'poetic',
      text: '',
      created: now,
      updated: now,
    };
  }

  const SAMPLE = [
    'Kroti li lombi, po miyo doli lirana.',
    'Taivo po havliha, ata li veluri po lombila sidu lirala.',
    'Ata toda-coda raho bioba ka taivo de rale.',
    '',
    'Melodia, Melodia, li meloasasan,',
    'Taivo ka maivo de loresonbu.',
    'Maivo bisu amora taivo seye —',
    'Maivo de valla ka doli taivo de lira.',
  ].join('\n');

  function seed() {
    const c1 = { id: 'c' + uid(), name: 'Devotionals', created: new Date().toISOString() };
    const c2 = { id: 'c' + uid(), name: 'Drafts', created: new Date().toISOString() };
    const p1 = blankPiece(c1.id, 'Vorbalira ala Melodia');
    p1.text = SAMPLE;
    p1.kind = 'song';
    p1.register = 'sacred';
    const p2 = blankPiece(c2.id, 'Untitled');
    return { version: 2, collections: [c1, c2], pieces: [p1, p2], activeId: p1.id };
  }

  function loadStore() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.pieces) && s.pieces.length) return s;
      }
      // Carry a draft over from the single-document version.
      const old = localStorage.getItem(OLD_KEY);
      if (old) {
        const d = JSON.parse(old);
        const s = seed();
        const p = s.pieces[0];
        p.title = d.title || p.title;
        p.text = typeof d.text === 'string' ? d.text : p.text;
        p.kind = d.kind || p.kind;
        p.register = d.register || p.register;
        return s;
      }
    } catch (e) {
      /* fall through to a fresh songbook */
    }
    return seed();
  }

  function saveStore() {
    try {
      localStorage.setItem(KEY, JSON.stringify(store));
      els.stamp.textContent = 'kept ' + new Date().toLocaleTimeString();
    } catch (e) {
      els.stamp.textContent = 'not kept — storage blocked';
    }
  }

  const activePiece = () => store.pieces.find((p) => p.id === store.activeId) || store.pieces[0];

  function openPiece(id) {
    store.activeId = id;
    const p = activePiece();
    els.title.value = p.title;
    els.text.value = p.text;
    els.kind.value = p.kind;
    els.register.value = p.register;
    shownLines = p.text.split('\n');
    // Pieces composed before the English followed its line kept it by text.
    p.englishLines = englishOf(p);
    delete p.english;
    renderLibrary();
    sizeText();
    analyse();
    saveStore();
  }

  function capturePiece() {
    const p = activePiece();
    if (!p) return;
    p.title = els.title.value;
    p.text = els.text.value;
    p.kind = els.kind.value;
    p.register = els.register.value;
    p.updated = new Date().toISOString();
  }

  /* ------------------------------------------------------------ render */

  const els = {};
  for (const id of [
    'text',
    'gutter',
    'title',
    'kind',
    'register',
    'q',
    'hits',
    'nFind',
    'sLines',
    'sWords',
    'sSyls',
    'sUnknown',
    'sErrors',
    'sLex',
    'edition',
    'stamp',
    'exportDlg',
    'exportKind',
    'exportScope',
    'exportText',
    'exportNote',
    'collections',
    'englishIn',
    'composeOut',
    'interlinear',
    'ilInner',
    'desk',
    'rail',
    'insp',
    'marks',
    'marksInner',
    'diagTip',
    'caretDiag',
    'glossToggle',
  ]) {
    els[id] = document.getElementById(id);
  }

  let analysis = { lines: [], findings: [], words: 0, syllables: 0, unknown: 0, errors: 0 };

  function analyse() {
    const register = els.register.value;
    const lines = [];
    let words = 0,
      syllables = 0,
      unknown = 0,
      errors = 0;
    const all = [];

    const text = els.text.value.split('\n');
    const checked = CK ? CK.check(text, activePiece().englishLines || [], { register }) : [];
    checked.forEach((f, k) => (f.index = k));
    text.forEach((line, i) => {
      const toks = tokenize(line);
      const parsed = toks.map((t) => ({ token: t, parse: parseWord(t) }));
      const findings = checked.filter((f) => f.line === i + 1);
      const syl = toks.reduce((n, t) => n + syllableCount(t), 0);
      const nUnk = parsed.filter((p) => !p.parse).length;
      const nErr = findings.filter((f) => f.severity === 'error').length;
      const nWrn = findings.filter((f) => f.severity === 'warn').length;
      words += toks.length;
      syllables += syl;
      unknown += nUnk;
      errors += nErr;
      all.push(...findings);
      const nFix = findings.filter((f) => f.autoFix).length;
      lines.push({
        no: i + 1,
        text: line,
        tokens: parsed,
        findings,
        syllables: syl,
        nErr,
        nWrn,
        nFix,
      });
    });

    analysis = { lines, findings: all, words, syllables, unknown, errors };
    renderAll();
  }

  function renderAll() {
    renderGutter();
    renderMarks();
    renderInterlinear();
    renderCheck();
    renderGloss();
    renderSound();
    renderFoot();
  }

  function renderGutter() {
    els.gutter.innerHTML = analysis.lines
      .map((l) => {
        const cls = l.nErr ? 'err' : l.nWrn ? 'wrn' : '';
        const dot = l.nErr ? 'err' : l.nWrn ? 'wrn' : l.text.trim() ? 'ok' : '';
        return (
          '<div class="grow ' +
          cls +
          '"><span aria-hidden="true">' +
          (l.text.trim() ? l.syllables : '') +
          '</span>' +
          (l.nFix
            ? '<button class="gfix" type="button" data-fix-line="' +
              l.no +
              '" aria-label="Apply the suggested fix to line ' +
              l.no +
              '" title="Apply the suggested fix">fix</button>'
            : '') +
          '<span class="dot ' +
          dot +
          '" aria-hidden="true"></span></div>'
        );
      })
      .join('');
  }

  const glossOn = () => document.body.classList.contains('gloss-on');
  const interlinearOn = () => document.body.classList.contains('interlinear-on') || glossOn();

  /* The underlines: the same text as the textarea, transparent, with each
     diagnostic's words in a mark. The most serious diagnostic wins a
     character. Whole-line diagnostics have no words to mark: the gutter dot
     and the panel carry them. */
  function renderMarks() {
    const html = analysis.lines
      .map((l) => {
        const spans = l.findings.filter((f) => f.token !== null && f.end > f.start);
        if (!spans.length) return '<div class="ml">' + (esc(l.text) || ' ') + '</div>';
        const sev = new Array(l.text.length).fill(null);
        for (const f of spans) {
          for (let c = f.start; c < f.end && c < l.text.length; c += 1) {
            if (sev[c] === null || SEV_RANK[f.severity] < SEV_RANK[sev[c]]) sev[c] = f.severity;
          }
        }
        let out = '';
        let c = 0;
        while (c < l.text.length) {
          let e = c;
          while (e < l.text.length && sev[e] === sev[c]) e += 1;
          const piece = esc(l.text.slice(c, e));
          out += sev[c]
            ? '<mark class="' +
              sev[c] +
              '" data-line="' +
              l.no +
              '" data-start="' +
              c +
              '" data-end="' +
              e +
              '">' +
              piece +
              '</mark>'
            : piece;
          c = e;
        }
        return '<div class="ml">' + out + '</div>';
      })
      .join('');
    els.marksInner.innerHTML = html;
    syncLayout();
  }

  /* Lines wrap in a narrow page, and the textarea cannot say where. The marks
     layer lays out exactly as the textarea does, so each line's real height
     is read from it: the gutter rows take those heights (so a syllable count
     and its fix button sit beside their own line), and the textarea grows to
     the full wrapped height (so it never scrolls inside itself). */
  function syncLayout() {
    // growing the textarea can bring up the page's scrollbar, which narrows
    // the text and changes the wrap: measure again until it holds still
    for (let pass = 0; pass < 3; pass += 1) {
      const rows = els.gutter.children;
      const lines = els.marksInner.children;
      let moved = false;
      for (let i = 0; i < rows.length; i += 1) {
        const h = lines[i] ? lines[i].getBoundingClientRect().height + 'px' : '';
        if (rows[i].style.height !== h) {
          rows[i].style.height = h;
          moved = true;
        }
      }
      const needed = Math.ceil(els.marksInner.getBoundingClientRect().height);
      if (needed > els.text.offsetHeight) {
        els.text.style.height = needed + 'px';
        moved = true;
      }
      if (!moved) break;
    }
  }
  if (window.ResizeObserver) new ResizeObserver(() => syncLayout()).observe(els.marksInner);

  /** What a fix would make of its line, for the tooltip and the panel. */
  function fixPreview(f) {
    const line = (analysis.lines[f.line - 1] || {}).text || '';
    if (f.fixStart === f.start && f.fixEnd === f.end)
      return f.fix === '' ? '(remove “' + f.token + '”)' : f.fix;
    return CK.applyFix(line, f);
  }

  function diagHtml(f) {
    return (
      '<span class="sev ' +
      f.severity +
      '">' +
      SEV_LABEL[f.severity] +
      '</span>' +
      esc(f.message) +
      '<span class="rule"> · ' +
      esc(f.rule) +
      '</span>' +
      (f.fix !== null
        ? '<div class="tip-fix">Fix: <span class="liraasa">' +
          esc(fixPreview(f)) +
          '</span>' +
          (f.autoFix ? '' : ' (check it first)') +
          '</div>'
        : '')
    );
  }

  /** The diagnostics on a line that cover a character range. */
  function diagsAt(no, from, to) {
    const l = analysis.lines[no - 1];
    if (!l) return [];
    return l.findings
      .filter((f) => f.token !== null && f.start < to && f.end > from)
      .sort((a, b) => SEV_RANK[a.severity] - SEV_RANK[b.severity]);
  }

  function showTip(list, rect) {
    if (!list.length) return hideTip();
    els.diagTip.className = 'diag-tip ' + list[0].severity;
    els.diagTip.innerHTML = list
      .map((f) => '<div class="tip-item">' + diagHtml(f) + '</div>')
      .join('');
    els.diagTip.hidden = false;
    const w = els.diagTip.offsetWidth;
    const h = els.diagTip.offsetHeight;
    const left = Math.min(Math.max(8, rect.left), window.innerWidth - w - 8);
    const below = rect.bottom + 6;
    els.diagTip.style.left = left + 'px';
    els.diagTip.style.top = (below + h > window.innerHeight ? rect.top - h - 6 : below) + 'px';
  }
  function hideTip() {
    els.diagTip.hidden = true;
  }

  /* Hover: the marks take no pointer events, so the pointer is tested
     against their boxes. */
  function markAtPoint(x, y) {
    for (const m of els.marksInner.querySelectorAll('mark')) {
      for (const r of m.getClientRects()) {
        if (x >= r.left && x <= r.right && y >= r.top - 2 && y <= r.bottom + 4) return { m, r };
      }
    }
    return null;
  }

  /* The caret: moving it onto a marked word shows the same tooltip, and
     the message is read out (keyboard and screen-reader access). */
  function caretDiag() {
    if (document.activeElement !== els.text) return;
    const before = els.text.value.slice(0, els.text.selectionStart).split('\n');
    const no = before.length;
    const col = before[before.length - 1].length;
    const list = diagsAt(no, Math.max(0, col - 1), col + 1).filter(
      (f) => f.start <= col && col <= f.end,
    );
    if (!list.length) {
      hideTip();
      els.caretDiag.textContent = '';
      return;
    }
    const m = [...els.marksInner.querySelectorAll('mark')].find(
      (x) =>
        Number(x.dataset.line) === no &&
        Number(x.dataset.start) <= col &&
        col <= Number(x.dataset.end),
    );
    if (m) showTip(list, m.getClientRects()[0] || m.getBoundingClientRect());
    els.caretDiag.textContent = list.map((f) => SEV_LABEL[f.severity] + ': ' + f.message).join(' ');
  }

  /* Apply fixes to one line: one diagnostic's, or every unambiguous one on
     the line. A fix that rewrites the whole line goes alone; word fixes are
     applied right to left so their offsets hold. Applied through the
     browser's own insertText, so Ctrl-Z undoes it. */
  function fixedLine(text, diags) {
    const whole = diags.find(
      (d) =>
        d.fixStart === 0 && d.fixEnd === text.length && d.fixEnd - d.fixStart > d.end - d.start,
    );
    if (whole) return CK.applyFix(text, whole);
    let out = text;
    let limit = Infinity;
    for (const d of [...diags].sort((a, b) => b.fixStart - a.fixStart)) {
      if (d.fixEnd > limit) continue;
      out = out.slice(0, d.fixStart) + d.fix + out.slice(d.fixEnd);
      limit = d.fixStart;
    }
    return out;
  }

  function applyLineFix(no, only) {
    const lines = els.text.value.split('\n');
    const text = lines[no - 1];
    const l = analysis.lines[no - 1];
    if (text === undefined || !l) return;
    const diags = only ? [only] : l.findings.filter((f) => f.autoFix);
    const next = fixedLine(text, diags);
    if (next === text) return;
    const start = lines.slice(0, no - 1).reduce((n, x) => n + x.length + 1, 0);
    els.text.focus();
    els.text.setSelectionRange(start, start + text.length);
    let done = false;
    try {
      done = document.execCommand('insertText', false, next);
    } catch (e) {
      done = false;
    }
    if (!done) {
      lines[no - 1] = next;
      els.text.value = lines.join('\n');
      sizeText();
      onEdit();
    }
    hideTip();
  }

  /* The English under each line in Compose mode: the sentence a composed
     line was built from. Lines with no English source show nothing. */
  function renderInterlinear() {
    if (!interlinearOn()) return;
    const english = activePiece().englishLines || [];
    els.ilInner.innerHTML = analysis.lines
      .map(
        (l, i) =>
          '<div class="il-row"><div>' +
          esc(english[i] || '') +
          '</div>' +
          (glossOn() && CK && l.text.trim()
            ? '<div class="il-gl">' + esc(CK.backTranslate(l.text).text) + '</div>'
            : '') +
          '</div>',
      )
      .join('');
  }

  /* Keep each piece's English in step with its lines as they are edited. */
  let shownLines = [];

  function syncEnglish() {
    const p = activePiece();
    const now = els.text.value.split('\n');
    p.englishLines = realignEnglish(shownLines, now, p.englishLines || []);
    shownLines = now;
  }

  function renderCheck() {
    const f = analysis.findings;
    els.nFind.textContent = f.length ? '(' + f.length + ')' : '';
    const panel = document.getElementById('panel-check');
    const live = analysis.lines.filter((l) => l.text.trim());
    if (!live.length) {
      panel.innerHTML =
        '<p class="empty">An empty page. Write a line and it is checked as you type.</p>';
      return;
    }
    const findings = CK
      ? diagnosticsHtml(f)
      : '<p class="empty">The grammar checker did not load' +
        (CK_ERROR ? ': ' + esc(String(CK_ERROR.message || CK_ERROR)) : '') +
        '.</p>';

    const rows = live
      .map((l) => {
        const shape = l.tokens
          .map((t) => {
            const sy = syllabify(t.token);
            return sy.syllables.map((_, i) => (i === sy.stress ? '<b>•</b>' : '·')).join('');
          })
          .join(' ');
        const dot = l.nErr ? 'err' : l.nWrn ? 'wrn' : 'ok';
        return (
          '<tr><td class="n">' +
          l.no +
          '</td><td><span class="dot ' +
          dot +
          '"></span></td>' +

          l.syllables +

    const lo = Math.min(...counts);
    const hi = Math.max(...counts);

    panel.innerHTML =
      findings +
      '<p class="label" style="margin-top:' +
      (findings ? 'var(--s4)' : '0') +
      '">' +
      live.length +
      ' lines · ' +
      lo +
      '–' +
      hi +
      ' syllables' +
      (lo === hi ? ' (even)' : '') +
      '</p>' +
      '<table class="tbl lines"><thead><tr><th>#</th><th></th><th>Syl</th><th>Stress</th></tr></thead>' +
      '<tbody>' +

        ? ''

  /* The diagnostics panel: sortable by severity or by line, each with its
     rule, its fix, and an Apply button when the fix is unambiguous. */

  function findingHtml(x) {
    return (
      '<div class="finding ' +
      x.severity +

      x.line +

      '<div class="body"><span><span class="sev ' +

  function diagnosticsHtml(f) {
    if (!f.length) return '';
    const count = (s) => f.filter((x) => x.severity === s).length;
    const summary = Object.keys(SEV_RANK)
      .filter((s) => count(s))
      .map((s) => count(s) + ' ' + SEV_LABEL[s].toLowerCase() + (count(s) === 1 ? '' : 's'))
      .join(' · ');
    const tools =
      '<div class="diag-tools"><label for="diagSort">Sort</label><select id="diagSort">' +
      '<option value="severity"' +
      (diagSort === 'severity' ? ' selected' : '') +
      '>by severity</option>' +
      '<option value="line"' +
      (diagSort === 'line' ? ' selected' : '') +
      '>by line</option></select>' +
      '<span class="label">' +
      summary +
      '</span></div>';
    if (diagSort === 'line') {
      const byLine = new Map();
      for (const x of [...f].sort(
        (a, b) =>
          a.line - b.line || SEV_RANK[a.severity] - SEV_RANK[b.severity] || a.start - b.start,
      )) {
        if (!byLine.has(x.line)) byLine.set(x.line, []);
        byLine.get(x.line).push(x);
      }
      return (
        tools +
        [...byLine]
          .map(([no, xs]) => {
            const fixes = xs.filter((x) => x.autoFix).length;
            return (
              '<div class="diag-head"><span class="label">Line ' +
              no +
              '</span>' +
              (fixes
                ? '<button class="btn btn-quiet" type="button" data-fix-line="' +
                  no +
                  '">Apply ' +
                  (fixes === 1 ? 'fix' : 'all ' + fixes + ' fixes') +
                  '</button>'
                : '') +
              '</div>' +
              xs.map(findingHtml).join('')
            );
          })
          .join('')
      );
    }
    return (
      tools +
      [...f]
        .sort(
          (a, b) =>
            SEV_RANK[a.severity] - SEV_RANK[b.severity] || a.line - b.line || a.start - b.start,
        )
        .map(findingHtml)
        .join('')
    );
  }

  /* ----------------------------------------------------------- lexicon */

  function searchLexicon(q) {
    const s = q.trim().toLowerCase();
    if (s.length < 2) return { words: [], closed: [] };
    const scored = [];
    for (const rec of H.values()) {
      let score = 0;
      if (rec.root === s) score = 100;
      else if (rec.forms.includes(s)) score = 90;
      else if (rec.root.startsWith(s)) score = 60;
      else if (rec.forms.some((f) => f.startsWith(s))) score = 40;
      if (!score) {
        for (const g of rec.glosses) {
          if (!g) continue;
          const gl = g.toLowerCase();
          if (gl === s) {
            score = 80;
            break;
          }
          if (gl.startsWith(s)) score = Math.max(score, 50);
          else if (gl.includes(s)) score = Math.max(score, 25);
        }
      }
      if (!score && rec.synonyms.some((x) => String(x).toLowerCase().includes(s))) score = 20;
      if (score) scored.push({ rec, score });
    }
    const closed = [];
    for (const [form, info] of CLOSED) {
      if (form === s || form.startsWith(s) || String(info.gloss).toLowerCase().includes(s)) {
        closed.push({ form, info });
      }
    }
    scored.sort((a, b) => b.score - a.score || a.rec.root.localeCompare(b.rec.root));
    return { words: scored.slice(0, 40), closed: closed.slice(0, 16) };
  }

  function renderHits() {
    const r = searchLexicon(els.q.value);
    if (!r.words.length && !r.closed.length) {
      els.hits.innerHTML =
        els.q.value.trim().length < 2
          ? '<p class="empty">Two letters or more. Searches spelling, any of the seven forms, the glosses and the English synonyms.</p>'
          : '<p class="empty">Nothing matches. Build a transparent MODIFIER+HEAD compound from two existing roots instead.</p>';
      return;
    }
    const parts = [];
    for (const { rec } of r.words) {
      const chips =
        '<span class="chip">' +
        (rec.type === 'P' ? 'primal' : 'compound') +
        '</span>' +
        (rec.register === 'p' ? '<span class="chip">poetic</span>' : '') +
        (rec.since === '1.1' ? '<span class="chip new">1.1</span>' : '') +
        (rec.components ? '<span class="chip">' + esc(rec.components.join(' + ')) + '</span>' : '');
      const forms = rec.forms
        .map((f, i) => {

  // Slot notes are 1.0 data; a later ruling that changes one is noted beside it.

  /** The rulings, grouped by edition, filtered by a search over every field. */
  function renderRulings(query) {
    const q = query.trim().toLowerCase();
    const hits = D.rulings.filter((r) => !q || JSON.stringify(r).toLowerCase().includes(q));
    const groups = new Map();
    for (const r of hits) {
      const ed = r[0].split(':')[0];
      if (!groups.has(ed)) groups.set(ed, []);
      groups.get(ed).push(r);
    }
    const out = [];
    for (const [ed, rs] of groups) {
      out.push(
        '<p class="label" style="margin-top:var(--s3)">' + esc(EDITION_NAMES[ed] || ed) + '</p>',
      );
      for (const [id, topic, ruling, examples] of rs) {
        out.push(
          '<div class="hit"><span class="mono label">' +
            esc(id) +
            '</span> <b>' +
            esc(topic) +
            '</b><div>' +
            esc(ruling) +
            '</div>' +
            (examples || [])
              .map(
                ([li, en]) =>
                  '<div><span class="liraasa rule-ex">' +
                  esc(li) +
                  '</span> <span class="label">' +
                  esc(en) +
                  '</span></div>',

              .join('') +
