  /* ------------------------------------------------------------ insert */

  function insertAtCursor(word) {
    const ta = els.text;
    const a = ta.selectionStart;
    const b = ta.selectionEnd;
    const before = ta.value.slice(0, a);
    const pad = before && !/\s$/.test(before) ? ' ' : '';
    ta.value = before + pad + word + ta.value.slice(b);
    const pos = a + pad.length + word.length;
    ta.focus();
    ta.setSelectionRange(pos, pos);
    onEdit();
  }

  function appendLine(line, english) {
    const ta = els.text;
    ta.value = ta.value + (ta.value && !ta.value.endsWith('\n') ? '\n' : '') + line;
    sizeText();
    onEdit();
    if (english) {
      activePiece().englishLines[ta.value.split('\n').length - 1] = english;
      renderInterlinear();
    }
  }

  /* ------------------------------------------------------------ export */

  function piecesFor(scope) {
    const p = activePiece();
    if (scope === 'piece') return [p];
    if (scope === 'collection')
      return store.pieces.filter((x) => x.collectionId === p.collectionId);
    return store.pieces;
  }

  function analyseText(text, register) {
    return text.split('\n').map((line, i) => ({
      no: i + 1,
      text: line,
      tokens: tokenize(line).map((t) => ({ token: t, parse: parseWord(t) })),
      syllables: tokenize(line).reduce((n, t) => n + syllableCount(t), 0),
      findings: line.trim() ? (CK ? CK.checkLine(line, i + 1, '', { register }) : []) : [],
    }));
  }

  /* The book's title: the piece, its shelf, or the songbook. */
  function bookTitle(scope) {
    const p = activePiece();
    if (scope === 'piece') return p.title || 'Untitled';
    if (scope === 'collection')
      return (store.collections.find((c) => c.id === p.collectionId) || {}).name || 'Songbook';
    return 'Songbook';
  }

  /* Print the typeset pages from a hidden frame; the browser's print dialog
     saves them as a PDF. The fonts load first, so the PDF is set in them. */
  function savePdf(scope) {
    capturePiece();
    const title = bookTitle(scope);
    const html = songbookHtml(piecesFor(scope), {
      collections: new Map(store.collections.map((c) => [c.id, c.name])),
      edition: D.version,
      title,
    });
    const frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.tabIndex = -1;
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(frame);
    const doc = frame.contentDocument;
    doc.open();
    doc.write(html);
    doc.close();
    const own = document.title;
    let gone = false;
    const done = () => {
      if (gone) return;
      gone = true;
      document.title = own;
      frame.remove();
    };
    const print = async () => {
      const fonts = doc.fonts ? doc.fonts.ready : Promise.resolve();
      await Promise.race([fonts, new Promise((r) => setTimeout(r, 2500))]);
      // Chrome names the PDF after the page's title.
      document.title = title;
      frame.contentWindow.addEventListener('afterprint', () => setTimeout(done, 0));
      frame.contentWindow.focus();
      frame.contentWindow.print();
      setTimeout(done, 60000); // in case afterprint never fires
    };
    if (doc.readyState === 'complete') print();
    else frame.addEventListener('load', print, { once: true });
  }

  function exportAs(kind, scope) {
    capturePiece();
    const pieces = piecesFor(scope);
    const out = [];

    if (kind === 'pdf') {
      for (const p of pieces) {
        out.push(p.title || 'Untitled', '');
        for (const st of stanzasOf(p)) {
          for (const l of st) out.push(l.liraasa, '    ' + (l.english || '—'));
          out.push('');
        }
        out.push('');
      }
      return {
        text: out.join('\n'),
        note:
          'A5 pages, each Liraasa line with its English beneath. Save PDF opens the print ' +
          'dialog: choose “Save as PDF” as the destination.',
      };
    }

    if (kind === 'text') {
      for (const p of pieces) out.push(p.title, '', p.text, '', '');
      return { text: out.join('\n'), note: pieces.length + ' piece(s), as written.' };
    }

    if (kind === 'interlinear') {
      for (const p of pieces) {
        out.push(p.title, '');
        for (const l of analyseText(p.text, p.register).filter((l) => l.text.trim())) {
          out.push(l.text);
          out.push('  ' + l.tokens.map((t) => segFor(t.parse)).join('  '));
          out.push('  ' + l.tokens.map((t) => glossFor(t.parse)).join(' · '));
          out.push('');
        }
        out.push('');
      }
      return { text: out.join('\n'), note: 'Surface, segmentation and per-morpheme gloss.' };
    }

    if (kind === 'lab') {
      out.push('# One .lab file per audio clip. Save each block as its own file,');
      out.push('# named to match the .wav. Text is already lowercased.', '');
      for (const p of pieces) {
        const slug = (p.title || 'untitled')
          .replace(/\s+/g, '_')
          .toLowerCase()
          .replace(/[^a-z0-9_]/g, '');
        analyseText(p.text, p.register)
          .filter((l) => l.text.trim())
          .forEach((l, i) => {
            out.push('### ' + slug + '_' + String(i + 1).padStart(3, '0') + '.lab');
            out.push(
              tokenize(l.text)
                .map((t) => t.toLowerCase())
                .join(' '),
            );
            out.push('');
          });
      }
      return {
        text: out.join('\n'),
        note: 'Montreal Forced Aligner transcripts, one block per line.',
      };
    }

    if (kind === 'dict') {
      const words = new Set();
      for (const p of pieces) for (const t of tokenize(p.text)) words.add(t.toLowerCase());
      const missing = [];
      for (const w of [...words].sort()) {
        if (!parseWord(w)) missing.push(w);
        const ph = toPhones(w);
        out.push(w + '\t' + ph.join(' '));
        const glided = [];
        let did = false;
        for (let i = 0; i < ph.length; i += 1) {
          if (ph[i] === ph[i + 1] && VOWELS.includes(ph[i])) {
            glided.push(ph[i]);
            i += 1;
            did = true;
          } else glided.push(ph[i]);
        }
        if (did) out.push(w + '\t' + glided.join(' '));
      }
      return {
        text: out.join('\n'),
        note:
          words.size +
          ' words, with a glided variant where there is hiatus.' +
          (missing.length ? '  ⚠ not in the lexicon: ' + missing.join(', ') : ''),
      };
    }

    if (kind === 'syl') {
      out.push('piece\tline\tsyllables\tstress\ttext');
      for (const p of pieces) {
        for (const l of analyseText(p.text, p.register).filter((l) => l.text.trim())) {
          const pat = l.tokens
            .map((t) => {
              const s = syllabify(t.token);
              return s.syllables.map((_, i) => (i === s.stress ? 'X' : '.')).join('');
            })
            .join(' ');
          out.push([p.title, l.no, l.syllables, pat, l.text].join('\t'));
        }
      }
      return {
        text: out.join('\n'),
        note: 'X marks the stressed syllable. Paste into a spreadsheet.',
      };
    }

    const coll = new Map(store.collections.map((c) => [c.id, c.name]));
    const doc = {
      songbook: scope === 'all' ? 'complete' : scope,
      edition: D.version,
      exported: new Date().toISOString(),
      pieces: pieces.map((p) => ({
        title: p.title,
        collection: coll.get(p.collectionId) || null,
        kind: p.kind,
        register: p.register,
        updated: p.updated,
        lines: analyseText(p.text, p.register)
          .filter((l) => l.text.trim())
          .map((l) => ({
            text: l.text,
            syllables: l.syllables,
            tokens: l.tokens.map((t) => ({
              surface: t.token,
              kind: t.parse ? t.parse.kind : 'unknown',
              segmentation: segFor(t.parse),
              gloss: glossFor(t.parse),
            })),
          })),
      })),
    };
    return { text: JSON.stringify(doc, null, 2), note: 'Structured, ready to store or re-render.' };
  }

  const showExport = () => {
    const { text, note } = exportAs(els.exportKind.value, els.exportScope.value);
    els.exportText.value = text;
    els.exportNote.textContent = note;
    const pdf = els.exportKind.value === 'pdf';
    document.getElementById('pdfBtn').hidden = !pdf;
    document.getElementById('copyBtn').hidden = pdf;
  };

  /* -------------------------------------------------------------- wire */

  let timer = null;
  function onEdit() {
    syncEnglish();
    analyse();
    clearTimeout(timer);
    timer = setTimeout(() => {
      capturePiece();
      renderLibrary();
      saveStore();
    }, 500);
  }

  function sizeText() {
    const rows = els.text.value.split('\n').length;
    const row = glossOn() ? 99.2 : interlinearOn() ? 68.8 : 31.2;
    els.text.style.height = Math.max(rows * row + 64, 420) + 'px';
  }

  els.text.addEventListener('scroll', () => {
    els.ilInner.style.transform = 'translateX(' + -els.text.scrollLeft + 'px)';
    els.marksInner.style.transform = 'translateX(' + -els.text.scrollLeft + 'px)';
    hideTip();
  });

  els.text.addEventListener('mousemove', (e) => {
    const hit = markAtPoint(e.clientX, e.clientY);
    if (!hit) return hideTip();
    const m = hit.m;
    showTip(diagsAt(Number(m.dataset.line), Number(m.dataset.start), Number(m.dataset.end)), hit.r);
  });
  els.text.addEventListener('mouseleave', hideTip);
  window.addEventListener('resize', () => {
    sizeText();
    syncLayout();
  });
  els.text.addEventListener('blur', hideTip);
  els.text.addEventListener('keyup', (e) => {
    if (e.key === 'Escape') return hideTip();
    if (/^(Arrow|Home|End|Page)/.test(e.key)) caretDiag();
  });
  els.text.addEventListener('click', caretDiag);

  /* Apply-fix buttons, in the gutter and the panel. */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-fix-line]');
    if (!btn) return;
    const no = Number(btn.dataset.fixLine);
    const only =
      btn.dataset.fixIndex === undefined ? null : analysis.findings[Number(btn.dataset.fixIndex)];
    applyLineFix(no, only);
  });
  document.addEventListener('change', (e) => {
    if (e.target.id !== 'diagSort') return;
    diagSort = e.target.value;
    try {
      localStorage.setItem('liraasa-diag-sort', diagSort);
    } catch (err) {
      /* per-viewer convenience only */
    }
    renderCheck();
    document.getElementById('diagSort').focus();
  });

  els.glossToggle.addEventListener('click', () => {
    const on = !glossOn();
    document.body.classList.toggle('gloss-on', on);
    els.glossToggle.setAttribute('aria-pressed', String(on));
    try {
      localStorage.setItem('liraasa-gloss', on ? '1' : '0');
    } catch (err) {
      /* per-viewer convenience only */
    }
    sizeText();
    renderInterlinear();
  });

  els.text.addEventListener('input', () => {
    sizeText();
    onEdit();
  });
  els.title.addEventListener('input', onEdit);
  els.register.addEventListener('change', onEdit);
  els.kind.addEventListener('change', onEdit);
  els.q.addEventListener('input', renderHits);

  els.hits.addEventListener('click', (e) => {
    const b = e.target.closest('[data-insert]');
    if (b && !b.disabled) insertAtCursor(b.dataset.insert);
  });

  els.collections.addEventListener('click', (e) => {
    const piece = e.target.closest('[data-piece]');
    if (piece) {
      capturePiece();
      saveStore();
      openPiece(piece.dataset.piece);
      return;
    }
    const add = e.target.closest('[data-addto]');
    if (add) {
      capturePiece();
      const p = blankPiece(add.dataset.addto);
      store.pieces.push(p);
      openPiece(p.id);
      els.title.focus();
      els.title.select();
    }
  });

  els.collections.addEventListener('input', (e) => {
    const name = e.target.closest('[data-coll]');
    if (!name) return;
    const c = store.collections.find((x) => x.id === name.dataset.coll);
    if (c) {
      c.name = name.value;
      clearTimeout(timer);
      timer = setTimeout(saveStore, 500);
    }
  });

  document.getElementById('newColl').addEventListener('click', () => {
    capturePiece();
    const c = { id: 'c' + uid(), name: 'New shelf', created: new Date().toISOString() };
    store.collections.push(c);
    const p = blankPiece(c.id);
    store.pieces.push(p);
    openPiece(p.id);
  });

  document.getElementById('newPiece').addEventListener('click', () => {
    capturePiece();
    const p = blankPiece(activePiece().collectionId);
    store.pieces.push(p);
    openPiece(p.id);
    els.title.focus();
    els.title.select();
  });

  for (const tab of document.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => {
      for (const t of document.querySelectorAll('.tab')) {
        const on = t === tab;
        t.setAttribute('aria-selected', String(on));
        document.getElementById('panel-' + t.dataset.tab).hidden = !on;
      }
      if (tab.dataset.tab === 'lex') els.q.focus();
      document.body.classList.toggle('interlinear-on', tab.dataset.tab === 'compose');
      sizeText();
      renderInterlinear();
      if (tab.dataset.tab === 'compose') els.englishIn.focus();
    });
  }

  const toggle = (btn, key) =>
    btn.addEventListener('click', () => {
      const on = els.desk.dataset[key] === 'on';
      els.desk.dataset[key] = on ? 'off' : 'on';
      btn.setAttribute('aria-pressed', String(!on));
      (key === 'rail' ? els.rail : els.insp).classList.toggle('hidden', on);
    });
  toggle(document.getElementById('railBtn'), 'rail');
  toggle(document.getElementById('inspBtn'), 'insp');

  document.getElementById('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const now = root.getAttribute('data-theme');
    const dark = now ? now === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });

  document.getElementById('composeBtn').addEventListener('click', runCompose);
  els.englishIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runCompose();
  });

  document.getElementById('appendBtn').addEventListener('click', () => {
    if (!drafts.length) runCompose();
    for (const d of drafts) appendLine(draftText(d), d.raw);
  });

  els.composeOut.addEventListener('click', (e) => {
    const opt = e.target.closest('.opt');
    if (opt) {
      drafts[+opt.dataset.d].clauses[+opt.dataset.k].chunks[+opt.dataset.c].chosen = +opt.dataset.o;
      renderCompose();
      return;
    }
    const ins = e.target.closest('[data-insert-draft]');
    if (ins) {
      const d = drafts[+ins.dataset.insertDraft];
      appendLine(draftText(d), d.raw);
    }
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    showExport();
    els.exportDlg.showModal();
  });
  els.exportKind.addEventListener('change', showExport);
  els.exportScope.addEventListener('change', showExport);
  document.getElementById('closeDlg').addEventListener('click', () => els.exportDlg.close());
  document.getElementById('pdfBtn').addEventListener('click', () => savePdf(els.exportScope.value));

  /* Deleting is forever: the button stays disabled until [FOREVER] is typed. */
  const del = {
    dlg: document.getElementById('deleteDlg'),
    input: document.getElementById('deleteInput'),
    go: document.getElementById('deleteGo'),
    what: document.getElementById('deleteWhat'),
  };
  document.getElementById('deleteBtn').addEventListener('click', () => {
    capturePiece();
    const p = activePiece();
    const lines = p.text.split('\n').filter((l) => l.trim()).length;
    const shelf = (store.collections.find((c) => c.id === p.collectionId) || {}).name;
    del.what.textContent =
      '“' +
      (p.title || 'Untitled') +
      '”' +
      (shelf ? ' on ' + shelf : '') +
      ', ' +
      lines +
      (lines === 1 ? ' line' : ' lines') +
      ', with its English, will be deleted.';
    del.input.value = '';
    del.go.disabled = true;
    del.dlg.showModal();
    del.input.focus();
  });
  del.input.addEventListener('input', () => {
    del.go.disabled = !confirmsDelete(del.input.value);
  });
  document.getElementById('deleteCancel').addEventListener('click', () => del.dlg.close());
  document.getElementById('deleteForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!confirmsDelete(del.input.value)) return;
    clearTimeout(timer); // a pending save must not write the deleted piece back
    const next = removePiece(store, activePiece().id, blankPiece);
    del.dlg.close();
    openPiece(next);
  });
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const btn = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(els.exportText.value);
      btn.textContent = 'Copied';
    } catch (e) {
      els.exportText.select();
      btn.textContent = 'Press ⌘/Ctrl-C';
    }
    setTimeout(() => (btn.textContent = 'Copy'), 1600);
  });

  /* -------------------------------------------------------------- boot */

  els.edition.textContent = D.version;
  els.sLex.textContent =
    D.headwords.length + ' headwords · ' + D.functionWords.length + ' function words';
  try {
    if (localStorage.getItem('liraasa-gloss') === '1') {
      document.body.classList.add('gloss-on');
      els.glossToggle.setAttribute('aria-pressed', 'true');
    }
  } catch (e) {
    /* per-viewer convenience only */
  }
  store = loadStore();
  renderGrammar();
  openPiece(store.activeId || store.pieces[0].id);
  renderHits();
  runCompose();
</script>
