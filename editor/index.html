<meta charset="utf-8" />
<title>Liraasa Songbook</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
/>

<style>
  /* ============================================================== tokens
     A composer's manuscript book: ledger paper with a red margin rule, written
     in blue-black ink. The red is a hairline only — it marks the margin, it is
     never a fill — and the gold appears on exactly one thing, the stressed
     syllable, because that is the mark a singer is looking for. */
  :root {
    color-scheme: light dark;

    --paper: #eceadf;
    --page: #fbfaf6;
    --raised: #f6f4ec;
    --ink: #1c2026;
    --ink-soft: #595f68;
    --ink-faint: #8a8f98;
    --rule: #dad7cb;
    --rule-firm: #bbb6a6;
    --margin: #b0564f;
    --accent: #2f4858;
    --accent-soft: #e2e9ee;
    --accent-ink: #ffffff;
    --gold: #8a6a1f;
    --gold-soft: #f2ead5;

    --error: #a3302f;
    --error-soft: #f8e8e6;
    --warn: #7e5a12;
    --warn-soft: #f6eedb;
    --ok: #2d5f4a;
    --ok-soft: #e4eee8;

    --ui: 'Work Sans', ui-sans-serif, system-ui, sans-serif;
    --lira: 'EB Garamond', 'Iowan Old Style', Palatino, Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace;

    --s1: 0.25rem;
    --s2: 0.5rem;
    --s3: 0.75rem;
    --s4: 1rem;
    --s5: 1.5rem;
    --s6: 2.25rem;
    --r: 4px;
    --rail: 232px;
    --insp: 400px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --paper: #121419;
      --page: #1a1d23;
      --raised: #22262d;
      --ink: #e7e5de;
      --ink-soft: #a0a5ae;
      --ink-faint: #767c86;
      --rule: #2b2f37;
      --rule-firm: #434852;
      --margin: #94514c;
      --accent: #93b6cb;
      --accent-soft: #1e2831;
      --accent-ink: #12151a;
      --gold: #cfae68;
      --gold-soft: #2a2417;

      --error: #ef9a96;
      --error-soft: #2d1b1a;
      --warn: #dcb871;
      --warn-soft: #2a2214;
      --ok: #85c3a5;
      --ok-soft: #16251f;
    }
  }

  :root[data-theme='dark'] {
    --paper: #121419;
    --page: #1a1d23;
    --raised: #22262d;
    --ink: #e7e5de;
    --ink-soft: #a0a5ae;
    --ink-faint: #767c86;
    --rule: #2b2f37;
    --rule-firm: #434852;
    --margin: #94514c;
    --accent: #93b6cb;
    --accent-soft: #1e2831;
    --accent-ink: #12151a;
    --gold: #cfae68;
    --gold-soft: #2a2417;

    --error: #ef9a96;
    --error-soft: #2d1b1a;
    --warn: #dcb871;
    --warn-soft: #2a2214;
    --ok: #85c3a5;
    --ok-soft: #16251f;
  }

  /* ================================================================ base */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  button,
  select,
  input,
  textarea {
    font: inherit;
    color: inherit;
  }

  .mono {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .btn {
    background: transparent;
    border: 1px solid var(--rule-firm);
    border-radius: var(--r);
    padding: 4px 9px;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 12px;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 500;
  }

  .btn-primary:hover {
    color: var(--accent-ink);
    opacity: 0.9;
  }

  .btn-quiet {
    border-color: transparent;
  }

  select {
    background: transparent;
    border: 1px solid var(--rule-firm);
    border-radius: var(--r);
    padding: 3px 6px;
    font-size: 12px;
    cursor: pointer;
  }

  /* =============================================================== shell */
  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100%;
    min-height: 0;
  }

  .masthead {
    display: flex;
    align-items: center;
    gap: var(--s3);
    padding: var(--s2) var(--s4);
    padding-top: calc(var(--s2) + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--rule);
    background: var(--raised);
    flex-wrap: wrap;
  }

  .masthead h1 {
    margin: 0;
    font-family: var(--lira);
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .masthead .ed {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 0 4px;
  }

  .spacer {
    margin-left: auto;
  }

  .desk {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr) var(--insp);
    min-height: 0;
    overflow: hidden;
  }

  .desk[data-rail='off'] {
    grid-template-columns: 0 minmax(0, 1fr) var(--insp);
  }

  .desk[data-insp='off'] {
    grid-template-columns: var(--rail) minmax(0, 1fr) 0;
  }

  .desk[data-rail='off'][data-insp='off'] {
    grid-template-columns: 0 minmax(0, 1fr) 0;
  }

  .col {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }

  .col.hidden {
    display: none;
  }

  /* ============================================================= library */
  .rail {
    background: var(--raised);
    border-right: 1px solid var(--rule);
  }

  .rail-head {
    display: flex;
    align-items: center;
    gap: var(--s2);
    padding: var(--s3) var(--s3) var(--s2);
    position: sticky;
    top: 0;
    background: var(--raised);
    border-bottom: 1px solid var(--rule);
    z-index: 1;
  }

  .coll {
    border-bottom: 1px solid var(--rule);
  }

  .coll-head {
    display: flex;
    align-items: center;
    gap: var(--s2);
    padding: var(--s2) var(--s3);
  }

  .coll-name {
    font-family: var(--lira);
    font-size: 1rem;
    font-weight: 600;
    background: transparent;
    border: none;
    padding: 1px 2px;
    border-radius: 3px;
    flex: 1;
    min-width: 0;
  }

  .coll-name:hover {
    background: var(--accent-soft);
  }

  .coll-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
  }

  .piece {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: var(--s2);
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-left: 2px solid transparent;
    padding: 5px var(--s3) 5px calc(var(--s3) + 10px);
    cursor: pointer;
    color: var(--ink-soft);
  }

  .piece:hover {
    background: var(--accent-soft);
  }

  .piece[aria-current='true'] {
    border-left-color: var(--margin);
    background: var(--page);
    color: var(--ink);
  }

  .piece .t {
    font-family: var(--lira);
    font-size: 0.98rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .piece .m {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .rail-foot {
    padding: var(--s3);
    display: flex;
    gap: var(--s2);
    flex-wrap: wrap;
  }

  /* ================================================================ page */
  .pagewrap {
    padding: var(--s5) var(--s4) var(--s6);
    display: flex;
    justify-content: center;
  }

  .page {
    background: var(--page);
    border: 1px solid var(--rule);
    border-radius: 2px;
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
    width: 100%;
    max-width: 44rem;
    min-height: 100%;
  }

  .page-head {
    padding: var(--s5) var(--s5) var(--s3);
    border-bottom: 1px solid var(--rule);
  }

  #title {
    font-family: var(--lira);
    font-size: 1.75rem;
    font-weight: 600;
    width: 100%;
    background: transparent;
    border: none;
    padding: 0;
    line-height: 1.2;
  }

  #title:focus {
    outline: none;
  }

  .page-meta {
    display: flex;
    gap: var(--s3);
    align-items: center;
    flex-wrap: wrap;
    margin-top: var(--s2);
  }

  /* The writing surface: a red margin rule, as on ledger paper, and the
     gutter counts sitting outside it. */
  .sheet {
    display: grid;
    grid-template-columns: 3.1rem 1fr;
    align-items: start;
  }

  .gutter {
    display: grid;
    border-right: 1px solid var(--margin);
    padding: var(--s5) 0 var(--s6);
  }

  .grow {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
    padding-right: 9px;
    height: 1.95rem;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .grow.err {
    color: var(--error);
  }
  .grow.wrn {
    color: var(--warn);
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex: none;
    background: transparent;
  }
  .dot.ok {
    background: var(--rule-firm);
  }
  .dot.wrn {
    background: var(--warn);
  }
  .dot.err {
    background: var(--error);
  }

  #text {
    font-family: var(--lira);
    font-size: 1.22rem;
    line-height: 1.95rem;
    width: 100%;
    border: none;
    background: transparent;
    padding: var(--s5) var(--s5) var(--s6) var(--s4);
    resize: none;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  #text:focus {
    outline: none;
  }

  /* Compose mode: the English under each line. The textarea cannot hold
     anything between its lines, so line spacing doubles and a layer that
     takes no pointer events draws the English in the gap, row for row, the
     way the gutter draws the syllable counts. Lines do not wrap here, or the
     rows would drift. */
  .page-body {
    position: relative;
    min-width: 0;
  }

  .interlinear {
    display: none;
    position: absolute;
    inset: 0;
    padding: var(--s5) var(--s5) var(--s6) var(--s4);
    overflow: hidden;
    pointer-events: none;
  }

  .il-row {
    height: 4.3rem;
    padding-top: 2.95rem;
    font-size: 12.5px;
    line-height: 1.1rem;
    color: var(--ink-soft);
    white-space: pre;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  body.interlinear-on .interlinear {
    display: block;
  }

  body.interlinear-on #text {
    line-height: 4.3rem;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
  }

  body.interlinear-on .grow {
    height: 4.3rem;
  }

  /* =========================================================== inspector */
  .insp {
    border-left: 1px solid var(--rule);
    background: var(--raised);
  }

  .insp-head {
    position: sticky;
    top: 0;
    background: var(--raised);
    border-bottom: 1px solid var(--rule);
    z-index: 1;
  }

  .tabs {
    display: flex;
    overflow-x: auto;
  }

  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 10px;
    cursor: pointer;
    color: var(--ink-faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tab[aria-selected='true'] {
    color: var(--ink);
    border-bottom-color: var(--margin);
  }

  .panel {
    padding: var(--s4);
    overflow-x: hidden;
  }

  .panel table {
    max-width: 100%;
  }

  .empty {
    color: var(--ink-faint);
    font-style: italic;
  }

  /* ---------------------------------------------------------- findings */
  .finding {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: var(--s3);
    padding: var(--s2) var(--s3);
    border-left: 2px solid var(--rule-firm);
    background: var(--page);
    margin-bottom: var(--s2);
  }

  .finding.error {
    border-left-color: var(--error);
    background: var(--error-soft);
  }
  .finding.warn {
    border-left-color: var(--warn);
    background: var(--warn-soft);
  }

  .finding .where {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .finding .rule {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--ink-faint);
  }

  /* ------------------------------------------------------------- table */
  .tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .tbl th,
  .tbl td {
    text-align: left;
    padding: 4px 6px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }

  .tbl th {
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
  }

  .tbl .n {
    font-family: var(--mono);
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .tbl .lira {
    font-family: var(--lira);
    font-size: 1rem;
  }

  .shape {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 1px;
    overflow-wrap: anywhere;
  }

  .tbl.lines {
    table-layout: fixed;
  }

  .tbl.lines td:first-child,
  .tbl.lines th:first-child {
    width: 2.2rem;
  }

  .tbl.lines td:nth-child(2),
  .tbl.lines th:nth-child(2) {
    width: 1.2rem;
  }

  .tbl.lines td:nth-child(3),
  .tbl.lines th:nth-child(3) {
    width: 2.6rem;
  }

  .shape b {
    color: var(--gold);
  }

  /* ------------------------------------------------------------- gloss */
  .gl {
    margin-bottom: var(--s4);
    padding-bottom: var(--s3);
    border-bottom: 1px solid var(--rule);
  }

  .gl:last-child {
    border-bottom: none;
  }

  .gl-no {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--ink-faint);
  }

  .gl-row {
    display: flex;
    flex-wrap: wrap;
    gap: var(--s3) var(--s4);
    margin-top: 3px;
  }

  .mo {
    display: grid;
    gap: 0;
    min-width: 0;
  }

  .mo .s {
    font-family: var(--lira);
    font-size: 1.05rem;
  }

  .mo .g {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--accent);
  }

  .mo .e {
    font-size: 11px;
    color: var(--ink-soft);
    max-width: 17ch;
  }

  .mo.unk .s {
    color: var(--error);
    text-decoration: underline wavy var(--error);
    text-underline-offset: 3px;
  }

  .mo.nm .s {
    color: var(--gold);
  }

  /* ------------------------------------------------------------- sound */
  .ph {
    padding: var(--s3) 0;
    border-bottom: 1px solid var(--rule);
  }

  .ph:last-child {
    border-bottom: none;
  }

  .ph-head {
    display: flex;
    gap: var(--s3);
    align-items: center;
    flex-wrap: wrap;
  }

  .beats {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .beat {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--rule-firm);
  }

  .beat.on {
    background: var(--gold);
    width: 9px;
    height: 9px;
  }

  .ipa {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    word-break: break-word;
    margin-top: 2px;
  }

  .syls {
    font-family: var(--mono);
    font-size: 12px;
    margin-top: 3px;
  }

  .syls b {
    color: var(--gold);
  }

  /* ----------------------------------------------------------- compose */
  .compose-in {
    width: 100%;
    min-height: 5.5rem;
    border: 1px solid var(--rule-firm);
    border-radius: var(--r);
    background: var(--page);
    padding: var(--s3);
    font-family: var(--ui);
    font-size: 13px;
    resize: vertical;
  }

  .draft {
    margin-top: var(--s3);
    padding: var(--s3);
    border: 1px solid var(--rule);
    border-left: 2px solid var(--margin);
    background: var(--page);
  }

  .draft .out {
    font-family: var(--lira);
    font-size: 1.22rem;
    line-height: 1.6;
  }

  .draft .out .gap {
    color: var(--error);
    border-bottom: 1px dashed var(--error);
  }

  .chunks {
    display: flex;
    flex-direction: column;
    gap: 1px;
    margin-top: var(--s3);
  }

  .chunk {
    display: grid;
    grid-template-columns: 8.5rem 1fr;
    gap: var(--s2);
    align-items: baseline;
    padding: 3px 0;
    border-bottom: 1px solid var(--rule);
  }

  .chunk .en {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .chunk .role {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--ink-faint);
    display: block;
  }

  .opts {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }

  .opt {
    font-family: var(--lira);
    font-size: 1rem;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 0 5px;
    cursor: pointer;
    color: var(--ink-soft);
  }

  .opt:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .opt[aria-pressed='true'] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 500;
  }

  .opt .sl {
    font-family: var(--mono);
    font-size: 8px;
    color: var(--ink-faint);
    margin-left: 3px;
  }

  .nomatch {
    font-size: 12px;
    color: var(--error);
  }

  .cnote {
    flex-basis: 100%;
    font-size: 11px;
    color: var(--ink-faint);
  }

  .clause-sep {
    margin-top: var(--s2);
  }

  /* ----------------------------------------------------------- lexicon */
  #q,
  #rq {
    width: 100%;
    padding: 6px 9px;
    border: 1px solid var(--rule-firm);
    border-radius: var(--r);
    background: var(--page);
    margin-bottom: var(--s3);
  }

  .rule-ex {
    font-family: var(--lira);
    font-size: 1rem;
  }

  .hit {
    padding: var(--s2) 0;
    border-bottom: 1px solid var(--rule);
  }

  .hit-top {
    display: flex;
    gap: var(--s2);
    align-items: baseline;
    flex-wrap: wrap;
  }

  .hit .w {
    font-family: var(--lira);
    font-size: 1.05rem;
    font-weight: 600;
  }

  .chip {
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 1px 4px;
    border-radius: 2px;
    background: var(--raised);
    color: var(--ink-faint);
    border: 1px solid var(--rule);
  }

  .chip.new {
    background: var(--gold-soft);
    color: var(--gold);
    border-color: var(--gold);
  }

  .hit .d {
    color: var(--ink-soft);
    font-size: 12px;
  }

  .forms {
    display: flex;
    flex-wrap: wrap;
    gap: 1px var(--s3);
    margin-top: 2px;
  }

  .fbtn {
    background: none;
    border: none;
    padding: 1px 3px;
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--lira);
    font-size: 0.95rem;
    text-align: left;
  }

  .fbtn:hover {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .fbtn .sl {
    font-family: var(--mono);
    font-size: 8px;
    color: var(--ink-faint);
    display: block;
  }

<script src="liraasa-data.js"></script>
<script>
  'use strict';

  /* =====================================================================
     Liraasa Songbook — a journal for writing songs and speeches.

     Everything runs in this file against the bundle in liraasa-data.js.
     Nothing is sent anywhere; the songbook lives in this browser.

     Rules come from the lexicon's own `grammar`, `morphology` and `phonology`
     blocks and from the Grammar Guide, not from guesswork:
       - the seven forms and the verb rule
       - lexicon-first parsing, never blind suffix stripping
       - the 20-slot clause template and its 13 exclusions
       - penultimate stress; hiatus vowels are separate syllables

     The Compose tab is an **assisted composer**, not a translator. It finds
     candidate words through the English synonym and gloss index and assembles
     them in clause-template order. Every word it offers is a real lexicon
     entry; where English has no Liraasa equivalent it says so rather than
     inventing one.
     ===================================================================== */

  const D = window.LIRAASA;
  const VOWELS = 'aeiou';
  const SLOT_NAME = ['R', 'R+asa', 'R+na', 'VERB', 'R+nasan', 'R+san', 'R+asasan'];
  const SUFFIX = ['', 'asa', 'na', null, 'nasan', 'san', 'asasan'];

  /* ----------------------------------------------------------- morphology */

  function verbOf(root) {
    if (root === 'opi') return 'opioa';
    const f = root[0];
    if (f === 'n') return root + 'nia';
    if (f === 's') return root + 'sia';
    if (VOWELS.includes(f)) return root + 'a';
    return root + f + 'a';
  }

  const formsOf = (root) => SUFFIX.map((s, i) => (i === 3 ? verbOf(root) : root + s));

  /* ------------------------------------------------------------ phonetics */

  const PHONE = {
    a: 'a',
    e: 'e',
    i: 'i',
    o: 'o',
    u: 'u',
    l: 'l',
    m: 'm',
    n: 'n',
    r: 'r',
    s: 's',
    v: 'v',
    y: 'j',
    b: 'b',
    d: 'd',
    p: 'p',
    t: 't',
    g: 'ɡ',
    h: 'h',
    z: 'z',
    k: 'k',
    c: 'k',
    f: 'f',
    j: 'd͡ʒ',
  };
  const DIGRAPH = { sh: 'ʃ', ch: 't͡ʃ' };

  function toPhones(word) {
    const w = word.toLowerCase();
    const out = [];
    for (let i = 0; i < w.length; ) {
      const pair = w.slice(i, i + 2);
      if (DIGRAPH[pair]) {
        out.push(DIGRAPH[pair]);
        i += 2;
        continue;
      }
      const ch = w.charAt(i);
      i += 1;
      if (PHONE[ch]) out.push(PHONE[ch]);
    }
    return out;
  }

  /** Every vowel is a nucleus; a medial cluster splits between consonants. */
  function syllabify(word) {
    const w = word.toLowerCase();
    const units = [];
    for (let i = 0; i < w.length; ) {
      const pair = w.slice(i, i + 2);
      if (DIGRAPH[pair]) {
        units.push({ v: false, t: pair });
        i += 2;
        continue;
      }
      const ch = w.charAt(i);
      i += 1;
      if (PHONE[ch]) units.push({ v: VOWELS.includes(ch), t: ch });
    }
    const sy = [];
    let onset = [];
    for (const u of units) {
      if (!u.v) {
        onset.push(u.t);
        continue;
      }
      if (sy.length && onset.length > 1) {
        sy[sy.length - 1] += onset.slice(0, -1).join('');
        onset = onset.slice(-1);
      }
      sy.push(onset.join('') + u.t);
      onset = [];
    }
    if (onset.length) {
      if (!sy.length) return { syllables: [], stress: 0 };
      sy[sy.length - 1] += onset.join('');
    }
    return { syllables: sy, stress: sy.length <= 1 ? 0 : sy.length - 2 };
  }

  const syllableCount = (w) => syllabify(w).syllables.length;

  /* ---------------------------------------------------------- the index */

  const H = new Map();
  const FORM = new Map();
  const DERIV = new Map();
  const CLOSED = new Map();
  /** English phrase -> candidate Liraasa words. Built for the composer. */
  const EN = new Map();

  function pushForm(sp, ref) {
    const l = FORM.get(sp);
    if (l) l.push(ref);
    else FORM.set(sp, [ref]);
  }

  const enKey = (phrase) =>
    String(phrase)
      .trim()
      .toLowerCase()
      .replace(/^(a|an|the|to)\s+/, '');

  function addEn(phrase, cand) {
    const key = enKey(phrase);
    if (key.length < 2 || key.length > 42) return;
    const l = EN.get(key);
    if (l) {
      if (!l.some((c) => c.word === cand.word)) l.push(cand);
    } else {
      EN.set(key, [cand]);
    }
  }

  /** Split a gloss into its separate senses, the way the lexicon writes them.
      A parenthetical is a gloss's note, so "Society (Mind of Place)" also
      stands as "Society". */
  const senses = (g) =>
    String(g)
      .split(/[;,]/)
      .flatMap((s) => [s.trim(), s.replace(/\s*\(.*?\)/g, '').trim()])
      .filter((s, i, all) => s.length > 1 && all.indexOf(s) === i);

  (function buildIndex() {
    for (const [root, type, components, glosses, register, dIx, synonyms, since] of D.headwords) {
      const rec = {
        root,
        type,
        components: components || null,
        glosses,
        register,
        domain: D.domains[dIx],
        synonyms,
        since,
        forms: formsOf(root),
      };
      H.set(root, rec);
      rec.forms.forEach((f, slot) => pushForm(f, { root, slot }));
      for (const d of ['yo', 'vu', 'pago']) {
        if (root === 'mavo' && d === 'pago') continue; // blocked by morphology
        DERIV.set(root + d, { root, suffix: d });
      }
      // The English index: every glossed slot and every synonym. The synonym
      // list mixes the senses of all seven forms, so a synonym that is already
      // a slot's gloss stays with that slot: "shimmering" is sizosan, not sizo.
      const glossed = new Set();
      glosses.forEach((g, slot) => {
        if (!g) return;
        for (const s of senses(g)) {
          glossed.add(enKey(s));
          addEn(s, { word: rec.forms[slot], root, slot, kind: 'lexical' });
        }
      });
      for (const syn of synonyms) {
        if (glossed.has(enKey(syn))) continue;
        addEn(syn, { word: root, root, slot: 0, kind: 'lexical', synonym: true });
      }
    }

    const closed = (rows, kind, fIx, gIx) => {
      for (const r of rows) {
        const form = r[fIx];
        if (!form || form.includes(' ') || form.startsWith('-')) continue;
        if (!CLOSED.has(form)) CLOSED.set(form, { kind, gloss: r[gIx] || '' });
        for (const s of String(r[gIx] || '').split(/[;,/]/)) {
          addEn(s.replace(/\(.*?\)/g, ''), { word: form, kind });
        }
      }
    };
    closed(D.functionWords, 'function word', 0, 1);
    closed(D.correlatives, 'correlative', 0, 3);
    closed(D.timeWords, 'time word', 0, 1);
    closed(D.particles, 'particle', 0, 1);
    for (const [form, person, number] of D.pronouns) {
      CLOSED.set(form, { kind: 'pronoun', gloss: person + ' ' + number });
    }
    for (const [base, family] of D.colors) {
      CLOSED.set(base, { kind: 'colour', gloss: family.toLowerCase() });
      addEn(family, { word: base, kind: 'colour' });
      for (const m of ['narvo', 'bio', 'juba', 'lumi']) {
        CLOSED.set(base + m, { kind: 'colour', gloss: family.toLowerCase() + ' · ' + m });
      }
    }
    for (const v of Object.values(D.numbers)) CLOSED.set(v, { kind: 'numeral', gloss: '' });
    for (const [n, v] of Object.entries(D.numbers)) addEn(n, { word: v, kind: 'numeral' });
  })();

  const NAMES = new Set(D.names.map((n) => n.toLowerCase()));
  const NUMERALS = new Set(Object.values(D.numbers));
  const knownStem = (s) => FORM.has(s) || DERIV.has(s) || CLOSED.has(s);

  /* ---------------------------------------------------------- the parser
     Lexicon-first: many roots end in letters that look like suffixes (navu,
     sevu, trana, pago), so a known spelling always beats a decomposition. */

  function parseWord(raw) {
    const w = raw.toLowerCase();
    if (!w) return null;
    if (FORM.has(w)) return { kind: 'lexical', refs: FORM.get(w), suffixes: [], stem: w };

    const c = CLOSED.get(w);
    if (c) return { kind: c.kind, gloss: c.gloss, stem: w, suffixes: [] };

    let body = w;
    let ordinal = false;
    if (body.endsWith('-ne')) {
      body = body.slice(0, -3);
      ordinal = true;
    }
    const parts = body.split('-');
    if (parts.length && parts.every((p) => NUMERALS.has(p))) {
      return { kind: 'numeral', stem: w, suffixes: [], gloss: ordinal ? 'ordinal' : '' };
    }

    if (DERIV.has(w))
      return { kind: 'derivation', derivation: DERIV.get(w), suffixes: [], stem: w };

    let stem = w;
    const sfx = [];
    if (stem.endsWith('ri') && stem.length > 4) {
      stem = stem.slice(0, -2);
      sfx.unshift('-ri');
      if (!knownStem(stem) && stem.endsWith('ti') && stem.length > 4) {
        const inner = stem.slice(0, -2);
        if (knownStem(inner)) {
          stem = inner;
          sfx.unshift('-ti');
        }
      }
    } else if (stem.endsWith('ti') && stem.length > 4) {
      stem = stem.slice(0, -2);
      sfx.unshift('-ti');
    }
    if (sfx.length) {
      if (FORM.has(stem)) return { kind: 'lexical', refs: FORM.get(stem), suffixes: sfx, stem };
      if (DERIV.has(stem))
        return { kind: 'derivation', derivation: DERIV.get(stem), suffixes: sfx, stem };
      const c2 = CLOSED.get(stem);
      if (c2) return { kind: c2.kind, gloss: c2.gloss, suffixes: sfx, stem };
    }

    for (const p of D.motionPrefixes) {
      if (w.startsWith(p)) {
        const rest = w.slice(p.length);
        const refs = (FORM.get(rest) || []).filter((r) => r.slot === 3);
        if (refs.length) return { kind: 'motion', prefix: p, refs, stem: rest, suffixes: [] };
      }
    }

    if (w.includes('-de-')) {
      const [l, r] = w.split('-de-');
      if (NUMERALS.has(l) && NUMERALS.has(r)) return { kind: 'fraction', stem: w, suffixes: [] };
    }

    if (D.legacy[w]) return { kind: 'legacy', to: D.legacy[w], stem: w, suffixes: [] };
    if (NAMES.has(w) || /^[A-Z]/.test(raw)) return { kind: 'name', stem: raw, suffixes: [] };
    return null;
  }

  function glossFor(p) {
    if (!p) return '?';
    if (p.kind === 'lexical' || p.kind === 'motion') {
      const ref = p.refs[0];
      const g = H.get(ref.root).glosses[ref.slot];
      return (p.prefix ? p.prefix + ' ' : '') + (g || '(' + SLOT_NAME[ref.slot] + ', unused)');
    }
    if (p.kind === 'derivation') {
      const map = { yo: 'one who', vu: 'great', pago: 'place of' };
      return (
        map[p.derivation.suffix] + ' ' + (H.get(p.derivation.root).glosses[0] || p.derivation.root)
      );
    }
    if (p.kind === 'legacy') return 'pre-1.0 → ' + p.to;
    if (p.kind === 'name') return 'name';
    return p.gloss || p.kind;
  }

  function segFor(p) {
    if (!p) return '';
    const s = (p.suffixes || []).join('');
    if (p.kind === 'lexical') {
      const ref = p.refs[0];
      const rec = H.get(ref.root);
      const base = rec.components ? rec.components.join('+') : ref.root;
      const slot =
        ref.slot === 0 ? '' : '-' + SLOT_NAME[ref.slot].replace('R+', '').replace('VERB', 'v');
      return base + slot + s;
    }
    if (p.kind === 'derivation') return p.derivation.root + '-' + p.derivation.suffix + s;
    if (p.kind === 'motion') return p.prefix + p.refs[0].root + '-v';
    return p.kind + s;
  }

  /* --------------------------------------------------- clause checking */

  const RANK = {};
  const slotRow = (name) => D.grammar.slots.find((s) => s[1] === name) || [0, 0, []];
  for (const [n, name] of [
    [4, 'TENSE'],
    [5, 'REALITY'],
    [7, 'MODAL'],
    [8, 'APPROACH'],
    [9, 'PHASE'],
    [10, 'EFFORT'],
    [11, 'ASPECT'],
    [12, 'ITERATION'],
    [13, 'EVIDENTIAL'],
  ]) {
    for (const w of slotRow(name)[2]) RANK[w] = n;
  }
  const SLOT_OF = {};
  for (const [, name, words] of D.grammar.slots) for (const w of words) SLOT_OF[w] ||= name;
  const EVID = new Set(slotRow('EVIDENTIAL')[2]);
  const ATT = new Set(slotRow('ATTITUDE')[2]);
  const STAT = new Set(slotRow('STATUS')[2]);
  const COPULA = new Set(['ke', 'ka', 'kapoki', 'loya', 'miyo']);
  const VALENCY = new Set(Object.keys(D.grammar.valency).filter((k) => k !== 'pattern'));
  const RESET = new Set(
    (
      'ata nara oro si sina kasa kopisa nevi raho fime kube nayo tuni sige kureli sidu ' +
      'tonsi narli korsi krotiata yava gome ki-oro sabri'
    ).split(' '),
  );

  const TENSE = new Set(slotRow('TENSE')[2]);
  // FRAME also lists "time words" and "correlatives of time": descriptions, not words.
  const FRAME_OPS = new Set(slotRow('FRAME')[2].filter((w) => !w.includes(' ')));
  // The frame words that open their clause, followed by a comma. Time words
  // such as eli-krono are not among them: they open or close a clause, and
  // the comma after an opening one is optional (1.2:G24).
  const FRAME_WORDS = FRAME_OPS;
  // Prepositions, read from the function-word positions; the copulas and the
  // clause conjunction kureli mention location too, and are not prepositions.
  const PREP = new Set(
    D.functionWords
      .filter((r) =>
        /location|goal and direction|source|accompaniment|benefactive|relation|between two|proximity|distance|prepositional absence|passive agent/.test(
          r[2],
        ),
      )
      .map((r) => r[0])
      .filter((w) => !COPULA.has(w) && !RESET.has(w)),
  );
  // Clause openers whose clause must carry its own verb.
  const SUBORDINATOR = new Set(['raho', 'fime', 'kube', 'si', 'kopisa', 'sige', 'nevi']);
  const NOUN_SLOTS = [0, 1, 2];
  /* Each noun form's own adjective: root → -san, -asa → -asasan, -na → -nasan.
     lordina (chaos) describes with lordinasan, never lordisan. */
  const ADJ_OF_NOUN = { 0: 5, 1: 6, 2: 4 };
  /** The adjective a noun reading turns into: { form, gloss, slot }. Gloss is '' if unused. */
  const adjectiveOf = (ref) => {
    const h = H.get(ref.root);
    const slot = ADJ_OF_NOUN[ref.slot];
    return { form: h.forms[slot], gloss: h.glosses[slot] || '', slot };
  };

  function tokenize(text) {
    const out = [];
    const re = /[A-Za-z][A-Za-z'-]*/g;
    let m;
    while ((m = re.exec(text))) {
      const t = m[0].replace(/^[-']+|[-']+$/g, '');
      if (t) out.push(t);
    }
    return out;
  }

  function splitClauses(words) {
    const out = [];
    let cur = [];
    for (const w of words) {
      const lw = w.toLowerCase();
      if ((RESET.has(lw) || (lw.startsWith('ki-') && lw !== 'ki-oro')) && cur.length) {
        out.push(cur);
        cur = [w];
      } else cur.push(w);
    }
    if (cur.length) out.push(cur);
    return out;
  }

  const isVerb = (w, p) =>
    COPULA.has(w) ||
    (p && (p.kind === 'motion' || (p.kind === 'lexical' && p.refs.some((r) => r.slot === 3))));

  // Anything that can fill the verb slot: a verb form, a copula, a valency
  // operator, or gome (whose own verb follows).
  const fillsVerbSlot = (w, raw) => VALENCY.has(w) || w === 'gome' || isVerb(w, parseWord(raw));
  // A lexical word with no verb reading: a noun or an adjective.
  const nonVerbLexical = (p) => p && p.kind === 'lexical' && p.refs.every((r) => r.slot !== 3);
  const onlyNoun = (p) =>
    p && p.kind === 'lexical' && p.refs.every((r) => NOUN_SLOTS.includes(r.slot));
  // A word with only verb readings, or a copula: one that cannot be a noun.
  const strictVerb = (w, p) =>
    COPULA.has(w) ||
    Boolean(
      p && (p.kind === 'motion' || (p.kind === 'lexical' && p.refs.every((r) => r.slot === 3))),
    );
  /** Lexicon compounds by their two components: "faru+lavra" → farulavra. */
  let compoundOf = null;
  const compoundFor = (a, b) => {
    compoundOf ||= new Map(
      [...H.values()].filter((h) => h.components).map((h) => [h.components.join('+'), h.root]),
    );
    return compoundOf.get(a + '+' + b);
  };
  const verbHint = (p) => {
    const ref = p.refs.find((r) => H.get(r.root).glosses[3]);
    return ref ? '; its verb is ' + H.get(ref.root).forms[3] : '';
  };

  /* ------------------------------------------------------ the slot parser
     Every token of a clause lands in one slot of the 1.0 template, or in a
     noun phrase inside one:

       [FRAME] [NP hozi] SUBJECT [TENSE] [noma] [ne] [MODAL] … [EVIDENTIAL]
       VERB [OBJECT] [ADJUNCTS] [fuyi] [STATUS] [ATTITUDE] [ki]

     A token that cannot be placed is an error naming the token and the slot
     that was expected there. Tokens a more precise rule already explains
     (tense and operator order, frames, clause-final words, prepositions, sidu,
     de after a verb, two bare nouns) are left to that rule. */

  const DET_W = new Set(['li', 'baba', 'eli', 'ola', 'eliri', 'olari', 'ki-eli']);
  const QUANT_W = new Set(['toda', 'somi', 'nuna', 'muya', 'poka', 'rada', 'ki-muya']);
  const DEGREE_W = new Set(['ruli', 'kasi', 'menu', 'mosa', 'lusu', 'gase']);
  const FOCUS_W = new Set(['tu', 'yesta', 'pendi', 'vinto', 'doli']);
  // Words that stand outside the template: discourse, greetings, answers.
  const FREE_W = new Set(
    'hema nido yori zoke fisa yade yeko voge zabo kepi lorejuba hozi'.split(' '),
  );
  const PREP_ALL = new Set([...PREP, 'transa', 'ultra', 'tamo', 'sabri', 'korsi', 'gagu', 'gase']);
  // Time words in the function-word table: adverbials, and nouns after de (vesno de deyaapo).
  const TIME_FW = new Set(['deyapressa', 'deyaapo', 'deyafutu', 'futupago', 'fututi']);
  const DEMONSTRATIVE = new Set(['eli', 'ola', 'eliri', 'olari']);
  const PRONOUNS = new Set(D.pronouns.map((r) => r[0]));
  // Coordinators and connectors: each clause they open has its own one verb.
  const EMBEDS_NOT = new Set('ata nara oro tonsi narli korsi krotiata sabri yava gome'.split(' '));
  // Correlatives of place, time, manner and cause are adverbials; of thing and person, nouns.
  const ADVERB_CORR = /-(pago|krono|modo|kasa)$/;

  /** What a token can be: a set of roles the parser may place it in. */
  function rolesOf(w, p) {
    const r = new Set();
    if (TENSE.has(w)) r.add('tense');
    if (RANK[w] !== undefined || w === 'noma') r.add('op');
    // ne floats: before the verb, or before any constituent it negates (Ne Dorin bumreba).
    if (w === 'ne') r.add('focus');
    if (TIME_FW.has(w)) r.add('adv').add('noun');
    // Question words: ki-coda and ki-nela are nouns, ki-pago and ki-krono adverbials.
    if (w.startsWith('ki-') && !DET_W.has(w) && !QUANT_W.has(w) && w !== 'ki-oro') {
      r.add(ADVERB_CORR.test(w) ? 'adv' : 'noun');
    }
    if (COPULA.has(w)) r.add('copula');
    if (VALENCY.has(w) || w === 'gome') r.add('valency');
    if (DET_W.has(w)) r.add('det');
    if (QUANT_W.has(w)) r.add('quant');
    if (DEGREE_W.has(w)) r.add('degree');
    if (FOCUS_W.has(w)) r.add('focus');
    if (FREE_W.has(w)) r.add('free');
    if (PREP_ALL.has(w)) r.add('prep');
    if (PRONOUNS.has(w)) r.add('noun');
    if (ATT.has(w) || STAT.has(w) || FRAME_OPS.has(w) || w === 'ki' || w === 'fuyi')
      r.add('placed');
    if (!p) return r.add('noun'); // unknown or a name: reported elsewhere, placed as a noun
    if (p.kind === 'lexical') {
      for (const ref of p.refs) {
        r.add(ref.slot === 3 ? 'verb' : NOUN_SLOTS.includes(ref.slot) ? 'noun' : 'adj');
      }
    } else if (p.kind === 'motion') r.add('verb');
    else if (['derivation', 'name', 'fraction', 'legacy'].includes(p.kind)) r.add('noun');
    else if (p.kind === 'numeral') r.add('num');
    else if (p.kind === 'pronoun') r.add('noun');
    else if (p.kind === 'colour') r.add('adj').add('noun');
    else if (p.kind === 'correlative') r.add(ADVERB_CORR.test(w) ? 'adv' : 'noun');
    else if (p.kind === 'time word' && !TENSE.has(w)) r.add('adv').add('noun');
    else if (p.kind === 'particle') r.add('free');
    return r;
  }

  /** Verb forms whose gloss matches: the lexicon decides what is give-type. */
  const verbsGlossed = (re) =>
    new Set([...H.values()].filter((h) => re.test(h.glosses[3] || '')).map((h) => h.forms[3]));
  // The whole sense, not its first word: "to send up a stem" is not a giving.
  const GIVE_VERBS = verbsGlossed(
    /^to (give|lend|send|owe|sell|pay|bring|teach|show)(?=[;,]|$|\s+(alms|a gift|possession|rent)\b)/i,
  );
  const SAY_VERBS = verbsGlossed(
    /^to (speak|say|write|tell|talk|sing|ask|answer|whisper|shout|call|read|inscribe|announce|discuss|explain|describe|argue|preach|pray)\b/i,
  );

  function placeClause(cl, cr, flag, skip, warn) {
    const n = cl.length;
    const R = cl.map((w, i) => rolesOf(w, parseWord(cr[i])));
    const is = (i, role) => i < n && R[i].has(role);
    const verbal = (i) => is(i, 'verb') || is(i, 'copula') || is(i, 'valency');
    const strict = (i) => verbal(i) && !is(i, 'noun') && !is(i, 'adj');

    /* A noun phrase from i, as the template has it:
       [QUANT] [li|eli|ola…] [NUMBER] [ADJ…] NOUN[-ti][-ri] [sela] [de NP]…
       An adjective after an article is a noun phrase on its own (li
       ramumomvisan, "the forgotten"). Returns the end, or i for none. */
    const np = (i) => {
      let j = i;
      while (is(j, 'focus')) j += 1;
      if (is(j, 'quant')) j += 1;
      const lead = is(j, 'det');
      if (lead) j += 1;
      while (is(j, 'num') || is(j, 'degree')) j += 1;
      const before = j;
      while (is(j, 'adj') && !is(j, 'noun')) j += 1;
      if (is(j, 'noun')) {
        j += 1;
        if (cl[j] === 'sela') j += 1;
      } else if (lead && j === before && DEMONSTRATIVE.has(cl[j - 1])) {
        // eli, ola standing alone: "this", "that" (Ola ka vera.)
      } else if (!(j > before && (lead || before > i)) && !(before > i && is(before - 1, 'num'))) {
        return i;
      }
      while (cl[j] === 'de') {
        const e = np(j + 1);
        if (e === j + 1) break;
        j = e;
      }
      return j;
    };

    const opener = RESET.has(cl[0]) || cl[0]?.startsWith('ki-');
    // After sidu, gome and yava the verb comes at once; there is no subject.
    let state = ['sidu', 'gome', 'yava'].includes(cl[0]) ? 'verb' : 'start';
    let verbs = 0;
    let actor = false; // a valency operator's actor takes its own verb
    let lastVerb = -1;
    let i = opener ? 1 : 0;
    // A question word fronts its phrase: Ki-eli lira taivo amora?
    if (cl[0]?.startsWith('ki-') && cl[0] !== 'ki-oro') i = Math.max(np(0), 1);
    const hasVerb = cl.some((_, k) => verbal(k));
    /* A clause opened by raho, fime, kube… runs on into the main predicate
       (Li nela raho lirala ka benasan), so its second verb is not counted.
       A coordinated clause (ata, nara, oro…) has its own one verb. */
    const embeds = opener && !EMBEDS_NOT.has(cl[0]);

    while (i < n) {
      const w = cl[i];
      if (skip(i) || is(i, 'free') || is(i, 'placed')) {
        i += 1;
        continue;
      }
      if (is(i, 'focus')) {
        i += 1; // tu, yesta, pendi, vinto, doli, ne: before the constituent they scope over
        continue;
      }
      if (is(i, 'tense') || is(i, 'op')) {
        if (state === 'start' && is(i, 'adv')) {
          i += 1; // fututi maivo lirala: "soon", framing the clause
          continue;
        }
        if (state === 'start' || state === 'subject') state = 'verb';
        i += 1;
        continue;
      }
      if (is(i, 'prep')) {
        i = Math.max(np(i + 1), i + 1); // a stranded one is reported by its own rule
        continue;
      }
      if (w === 'la' && (is(i + 1, 'adj') || is(i + 1, 'noun'))) {
        i += 2;
        continue;
      }
      // A time word that opens the clause frames it (futupago maivo lirala);
      // after de it is a noun (vesno de deyaapo).
      if (is(i, 'adv') && (!is(i, 'noun') || (state === 'start' && np(i + 1) > i + 1))) {
        i += 1;
        continue;
      }
      if (w === 'de') {
        // de after a verb, or with nothing after it, has its own rule.
        if (i + 1 < n && !strict(i - 1)) {
          flag(
            i,
            is(i - 1, 'adj')
              ? 'de after the adjective “' +
                  cr[i - 1] +
                  '”: de needs a noun or pronoun on both sides (owner de thing)'
              : 'de needs a noun or pronoun on both sides (owner de thing)',
          );
        }
        i += 1;
        continue;
      }

      // The verb slot.
      if (
        verbal(i) &&
        (state === 'verb' ||
          state === 'subject' ||
          (state === 'start' && !is(i, 'noun')) ||
          (state === 'post' && (actor || strict(i))))
      ) {
        if (state === 'post' && !actor && verbs > 0 && !embeds) {
          flag(
            i,
            '“' +
              cr[i] +
              '” is a second verb in one clause; open its clause with a linker (fime, raho, ata, kopisa…)',
          );
        }
        if (actor) actor = false;
        else if (is(i, 'valency') && cl[i] !== 'gome') actor = true;
        verbs += 1;
        lastVerb = i;
        state = 'post';
        i += 1;
        continue;
      }

      // A noun phrase: the subject before the verb, an object or complement after it.
      const e = np(i);
      if (e > i) {
        /* A give-type verb takes VERB THEME ala RECIPIENT, or, when the
           recipient is a pronoun, VERB PRONOUN THEME: guraga maivo dossa
           cono (1.2:G26). Any other bare recipient is warned. */
        if (
          state === 'post' &&
          i === lastVerb + 1 &&
          GIVE_VERBS.has(cl[lastVerb]) &&
          !(e === i + 1 && PRONOUNS.has(cl[i])) &&
          !is(e, 'adv') &&
          np(e) > e
        ) {
          const recipient = cr.slice(i, e).join(' ');
          const theme = cr.slice(e, np(e)).join(' ');
          warn(
            '“' +
              cr[lastVerb] +
              '” is a give-type verb: only a pronoun recipient stands bare after it; otherwise VERB THEME ala RECIPIENT (' +
              cr[lastVerb] +
              ' ' +
              theme +
              ' ala ' +
              recipient +
              ')',
          );
        }
        if (state === 'start') state = 'subject';
        else if (state === 'subject' || state === 'verb') {
          if (hasVerb) {
            const pv = parseWord(cr[i]);
            flag(
              i,
              '“' +
                cr[i] +
                '” is in the verb slot but is not a verb form' +
                (pv && pv.kind === 'lexical' ? verbHint(pv) : ''),
            );
            verbs += 1; // read it as the verb, and go on
            lastVerb = i;
            state = 'post';
            i += 1;
            continue;
          }
          if (state === 'subject' && !cl.some((x) => TENSE.has(x))) {
            flag(
              i,
              '“' + cr[i] + '” opens a second noun phrase, but the clause has no verb or copula',
            );
          }
        }
        i = e;
        continue;
      }

      // An adjective after a copula is its complement. With no verb at all it
      // is the predicate itself: the guide writes Lira benasan, Nela vanisan.
      if (is(i, 'adj') && ((state === 'post' && COPULA.has(cl[lastVerb])) || !hasVerb)) {
        i += 1;
        while (is(i, 'adj') || is(i, 'degree')) i += 1;
        continue;
      }
      if (is(i, 'degree') && is(i + 1, 'adj')) {
        i += 1;
        continue;
      }

      flag(
        i,
        '“' +
          cr[i] +
          '” cannot be placed: expected ' +
          (state === 'post'
            ? COPULA.has(cl[lastVerb])
              ? 'the copula’s complement (a noun phrase or an adjective)'
              : 'the OBJECT (a noun phrase) or an adjunct (la + adjective, a prepositional phrase)'
            : state === 'start'
              ? 'the SUBJECT (a noun phrase)'
              : 'the VERB'),
      );
      i += 1;
    }
  }

  /* Shapes that read as relexified English: Liraasa words in English word
     order. Each one is a pattern the Song of Time audit found more than once.
     None decides the language; the fix is always the author's. */
  function checkShape(words, elided, add) {
    const lw = words.map((w) => w.toLowerCase());
    const p = words.map((w) => parseWord(w));
    const clauses = splitClauses(words);

    // Tense sits before the verb (slot 4 of 20), so something after it in the
    // same clause must fill the verb slot. A clause-final po is English "was".
    let at = 0;
    clauses.forEach((clause, k) => {
      const cl = lw.slice(at, at + clause.length);
      const cr = words.slice(at, at + clause.length);
      at += clause.length;
      const verbAt = cl.map((w, i) => fillsVerbSlot(w, cr[i]));
      const gomeNext = clauses[k + 1]?.[0]?.toLowerCase() === 'gome';
      cl.forEach((w, i) => {
        if (!TENSE.has(w)) return;
        if (verbAt.slice(0, i).some(Boolean)) return; // after the verb: G1 says so
        if (!verbAt.slice(i + 1).some(Boolean) && !gomeNext && !elided) {
          add(
            'error',
            w + ' has no verb or copula after it; tense comes before the verb (ke, ka, loya…)',
            'clause template',
          );
        }
      });

      // raho, fime, kube and the rest open a clause of their own: it needs a verb.
      const adjective = cr.some((w) => {
        const pw = parseWord(w);
        return pw && pw.kind === 'lexical' && pw.refs.some((r) => [4, 5, 6].includes(r.slot));
      });
      const verbless =
        SUBORDINATOR.has(cl[0]) &&
        cl.length > 1 &&
        !verbAt.some(Boolean) &&
        !adjective &&
        !gomeNext;
      if (verbless) {
        const noun = cr.slice(1).find((w) => nonVerbLexical(parseWord(w)));
        add(
          'error',
          cl[0] +
            ' opens a clause with no verb' +
            (noun ? ' (“' + noun + '” is not a verb form' + verbHint(parseWord(noun)) + ')' : ''),
          'clause template',
        );
        return; // that says it: the slot parser has nothing to add
      }

      // Every token lands in a slot. The parser leaves alone a token another
      // rule here explains: the second of two bare nouns, and a non-verb
      // straight after sidu.
      const start = at - clause.length;
      const nounPair = (g) =>
        g > 0 &&
        onlyNoun(p[g - 1]) &&
        onlyNoun(p[g]) &&
        !CLOSED.has(lw[g - 1]) &&
        !CLOSED.has(lw[g]);
      placeClause(
        cl,
        cr,
        (i, message) => add('error', message, 'slot'),
        (i) => nounPair(start + i) || (cl[0] === 'sidu' && i === 1 && !isVerb(cl[1], p[start + 1])),
        (message) => add('warn', message, 'ditransitive'),
      );
    });

    lw.forEach((w, i) => {
      const next = lw[i + 1];
      const pn = p[i + 1];

      // A preposition takes a noun phrase. ala is "toward", never infinitive "to".
      if (PREP.has(w)) {
        const stranded =
          (next === undefined && i > 0) ||
          TENSE.has(next) ||
          COPULA.has(next) ||
          PREP.has(next) ||
          ATT.has(next) ||
          next === 'ki' ||
          (pn && pn.kind === 'lexical' && pn.refs.every((r) => r.slot === 3));
        if (stranded) {
          add(
            'error',
            w +
              ' needs a noun phrase after it' +
              (w === 'ala' ? '; ala is “toward”, not the infinitive “to” (sidu, kopisa)' : ''),
            'noun phrase',
          );
        }
      }

      // sidu joins two verbs that share a subject (Maivo vurlova sidu lirala).
      // Clause-initial sidu nominalises a verb phrase (0.8:G6) and is left alone.
      if (w === 'sidu' && i > 0) {
        if (!isVerb(lw[i - 1], p[i - 1])) {
          add(
            'error',
            'sidu joins two verbs; “' +
              words[i - 1] +
              '” before it is not a verb form' +
              (nonVerbLexical(p[i - 1]) ? verbHint(p[i - 1]) : '') +
              ', and an object comes after the second verb',
            'sidu',
          );
        }
        if (COPULA.has(next)) {
          add(
            'error',
            'sidu takes a lexical verb, not the copula ' +
              next +
              ': “knew it to be truth” is fime ito ka …, “hope to become” is kopi loya',
            'sidu',
          );
        } else if (next !== undefined && !isVerb(next, pn)) {
          add(
            'error',
            'sidu joins two verbs; “' +
              words[i + 1] +
              '” after it is not a verb form' +
              (nonVerbLexical(pn) ? verbHint(pn) : ''),
            'sidu',
          );
        }
      }

      // de joins an owner and a thing: a noun phrase on each side, never a verb.
      if (w === 'de' && i > 0 && (next === undefined || strictVerb(lw[i - 1], p[i - 1]))) {
        add(
          'error',
          next === undefined
            ? 'de needs a noun phrase after it'
            : 'de cannot follow the verb “' +
                words[i - 1] +
                '”; de joins an owner and a thing (for “about”, give the verb an object: 1.2:G30)',
          'noun phrase',
        );
      }

      // 1.0 has no "about": a communication verb with su reads as "on".
      if (SAY_VERBS.has(w) && next === 'su') {
        add(
          'warn',
          "Liraasa has no 'about'; “" + words[i] + ' su” reads literally: use a de phrase',
          '1.2:G30',
        );
      }

      // fime introduces a content clause, whose subject comes next.
      if (w === 'fime' && next !== undefined && (COPULA.has(next) || TENSE.has(next))) {
        add(
          'error',
          'fime introduces a clause (“I know that you sing”); the demonstrative “that” is ola',
          'fime',
        );
      }

      // zafra, finra, lanto, kenvi open the clause, followed by a pause. A
      // scope word may stand before it (1.0:G1): Ne zafra.
      if (FRAME_WORDS.has(w) && lw.slice(0, i).some((x) => !FOCUS_W.has(x) && x !== 'ne')) {
        add('error', w + ' is a clause-initial frame, followed by a comma', '1.0 slot 1 FRAME');
      }

      // Two bare nouns side by side: a noun does not modify a noun (ADR-0011).
      // The first becomes its -san adjective: lira lavra is lirasan lavra.
      // Where that slot is "— (unused)" it cannot be used, so the lexicon's
      // compound, or else a de phrase. A pronoun is never a modifier noun.
      if (onlyNoun(p[i]) && onlyNoun(pn) && !CLOSED.has(lw[i]) && !CLOSED.has(next)) {
        const compound = compoundFor(p[i].refs[0].root, pn.refs[0].root);
        const adj = p[i].refs.map(adjectiveOf).find((x) => x.gloss);
        add(
          'error',
          '“' +
            words[i] +
            ' ' +
            words[i + 1] +
            '”: a noun does not modify a noun; ' +
            (adj
              ? 'use the adjective ' +
                adj.form +
                ' (' +
                adj.gloss +
                '): ' +
                adj.form +
                ' ' +
                words[i + 1]
              : adjectiveOf(p[i].refs[0]).form +
                ' is unused, so ' +
                (compound
                  ? 'use the compound ' + compound
                  : 'use a de phrase (' + words[i + 1] + ' de ' + words[i] + ')')),
          'noun phrase',
        );
      }
    });

    // A question keeps statement order and adds ki: no copula or tense up front.
    if (lw[lw.length - 1] === 'ki') {
      const s = RESET.has(lw[0]) ? 1 : 0;
      if (COPULA.has(lw[s]) || TENSE.has(lw[s])) {
        add(
          'error',
          'questions keep statement order; ' + lw[s] + ' is not moved to the front',
          'ki',
        );
      }
    }

    // A frame opens the clause and is followed by a pause. For any other time
    // word the comma is optional (1.2:G24), so for those it is a note.
    if (FRAME_WORDS.has(lw[0]) && lw.length > 1) {
      add('warn', lw[0] + ' frames the clause and is followed by a comma', '1.0 slot 1 FRAME');
    } else if (/-krono$/.test(lw[0]) && lw.length > 1) {
      add(
        'note',
        lw[0] + ' frames the clause; a comma after it, optional, marks the pause',
        '1.2:G24',
      );
    }

    // hema is hesitation: “well…”, “um”. It is not a preposition.
    if (lw[0] === 'hema' && lw.length > 1) {
      add('note', 'hema is hesitation (“well…”, “um”), usually set off by a pause', 'particles');
    }
  }

  /* English passives: "was/were (not) + participle". Each wants gome + verb,
     or a copula + the -san adjective, in its Liraasa line. */
  const PASSIVE_EN =
    /\b(?:was|were|is|are|been|be|being)\s+(?:not\s+)?(?:[a-z]+ed|[a-z]+en|born|done|made|sung|lost|found|heard|held|told|kept|left|taught|built|sent|brought|bought|thought|caught|won)\b/gi;

  function checkLine(text, no, register, english) {
    const f = [];
    const add = (severity, message, rule) => f.push({ line: no, severity, message, rule });

    if (english) {
      const passives = english.match(PASSIVE_EN) || [];
      const lw = tokenize(text).map((w) => w.toLowerCase());
      // A verb glossed "to be born" carries the passive itself: po kronobioka.
      const passiveVerb = (w) =>
        (FORM.get(w) || []).some((r) => r.slot === 3 && /^to be /i.test(H.get(r.root).glosses[3]));
      const marked = lw.filter((w) => w === 'gome' || COPULA.has(w) || passiveVerb(w)).length;
      if (passives.length > marked) {
        add(
          'warn',
          'the English is passive (' +
            passives.map((x) => '“' + x + '”').join(', ') +
            '); Liraasa marks it with gome + verb, or ke/ka + the -san adjective',
          'passive',
        );
      }
    }

    // A lone oro joins two equal parts, as ata does, and may open a clause
    // that continues the one before ("Or …"); oro A oro B is the emphatic
    // "either A or B" (1.2:G25). Nothing to check.

    const pieces = text.split(/([.,;:!?—…"“”()+=]+)/);
    for (let n = 0; n < pieces.length; n += 2) {
      const words = tokenize(pieces[n]);
      const elided = /[—…]/.test(pieces[n + 1] || ''); // cut off: Po — …, Maivo po ne povi—
      if (!words.length) continue;
      for (const clause of splitClauses(words)) {
        const lw = clause.map((w) => w.toLowerCase());
        const set = new Set(lw);

        for (const [a, b] of D.grammar.exclusions) {
          if (set.has(a) && set.has(b))
            add('error', a + ' and ' + b + ' cannot share a clause', '1.0:G16');
        }
        const ev = lw.filter((w) => EVID.has(w));
        if (new Set(ev).size > 1) {
          add('error', 'two evidentials in one clause: ' + [...new Set(ev)].join(', '), '1.0:G16');
        }

        lw.forEach((w, i) => {
          const rest = lw.slice(i + 1);
          if (w === 'ki' && rest.length) add('error', 'ki must end the clause', '1.0:G22');
          if (ATT.has(w) && rest.some((r) => !ATT.has(r) && r !== 'ki')) {
            add('error', w + ' is clause-final only', '1.0:G22');
          }
          if (STAT.has(w) && rest.some((r) => !ATT.has(r) && r !== 'ki')) {
            add('error', w + ' sits after the predicate, before the attitude marker', '1.0:G16');
          }
        });

        let last = 0;
        let seen = false;
        let pre = 0;
        lw.forEach((w, i) => {
          if (VALENCY.has(w) || w === 'sidu') {
            last = 0;
            seen = false;
            return;
          }
          const rank = RANK[w];
          if (rank === undefined) {
            if (isVerb(w, parseWord(clause[i]))) {
              seen = true;
              last = 99;
            }
            return;
          }
          pre += 1;
          if (seen) {
            if (!['reve', 'loki', 'bodu'].includes(w)) {
              add('error', w + ' (' + SLOT_OF[w] + ') cannot follow the verb', '1.0:G1');
            }
            return;
          }
          if (rank < last) add('error', w + ' (' + SLOT_OF[w] + ') is out of slot order', '1.0:G1');
          last = Math.max(last, rank);
        });

        if (pre > D.grammar.maxPreverbal) {
          add(
            'warn',
            pre + ' preverbal operators; ' + D.grammar.maxPreverbal + ' is the practical ceiling',
            '1.0:G16',
          );
        }
      }
      checkShape(words, elided, add);
    }

    for (const t of tokenize(text)) {
      const p = parseWord(t);
      if (!p) {
        add('error', '“' + t + '” is not a word of Liraasa', 'never invent a root');
        continue;
      }
      if (p.kind === 'legacy') add('warn', '“' + t + '” is pre-1.0; now ' + p.to, '1.0:G19');
      if (p.kind === 'lexical') {
        if (p.refs.some((r) => r.slot === 1 || r.slot === 6) && register !== 'sacred') {
          add(
            'note',
            '“' + t + '” is an ascended form; sacred register, or irreverent on purpose',
            '0.8:R10',
          );
        }
        // A -na form inverts its root; show both so a flipped meaning is seen.
        const neg = p.refs.find((r) => r.slot === 2);
        if (neg) {
          const g = H.get(neg.root).glosses;
          add(
            'note',
            '“' +
              t +
              '” is the negative of ' +
              neg.root +
              ' (“' +
              (g[0] || '?') +
              '”): “' +
              (g[2] || '?') +
              '”',
            '-na',
          );
        }
        if (p.refs.every((r) => !H.get(r.root).glosses[r.slot])) {
          add('warn', '“' + t + '” is a form whose slot has no meaning — “— (unused)”', '0.8:R2');
        }
      }
    }
    return f;
  }

  /** Every line's findings. */
  function checkText(lines, register, english) {
    return lines.flatMap((l, i) => (l.trim() ? checkLine(l, i + 1, register, english[i]) : []));
  }

  /* A mechanical back-translation from the lexicon: each word's first sense,
     a pronoun before de as a possessive. It judges nothing; it is shown
     beside the writer's own English so a drift in meaning can be seen. */
  const POSSESSIVE_OF = {
    maivo: 'my',
    taivo: 'your',
    saivo: 'his/her',
    ito: 'its',
    maivori: 'our',
    taivori: 'your',
    saivori: 'their',
    itori: 'their',
  };
  const PRONOUN_OF = {
    maivo: 'I',
    taivo: 'you',
    saivo: 'he/she',
    ito: 'it',
    maivori: 'we',
    taivori: 'you',
    saivori: 'they',
    itori: 'they',
  };
  const OBJECT_OF = {
    maivo: 'me',
    taivo: 'you',
    saivo: 'him/her',
    ito: 'it',
    maivori: 'us',
    taivori: 'you',
    saivori: 'them',
    itori: 'them',
  };
  const firstSense = (g) =>
    String(g)
      .split(/[;,/]/)[0]
      .replace(/\(.*?\)/g, '')
      .replace(/^to\s+/i, '')
      .trim()
      .toLowerCase();

  function backTranslate(line) {
    const t = tokenize(line);
    const out = [];
    for (let i = 0; i < t.length; i += 1) {
      const w = t[i].toLowerCase();
      if (PRONOUNS.has(w)) {
        // A pronoun is always the owner (1.2:G27): before de it is "my",
        // after it "of me".
        if ((t[i - 1] || '').toLowerCase() === 'de') {
          out.push(OBJECT_OF[w] || w);
          continue;
        }
        if ((t[i + 1] || '').toLowerCase() === 'de') {
          out.push(POSSESSIVE_OF[w] || w);
          i += 1;
        } else out.push(PRONOUN_OF[w] || w);
        continue;
      }
      const p = parseWord(t[i]);
      if (!p) out.push('[' + t[i] + ']');
      else if (p.kind === 'name') out.push(t[i]);
      else if (p.kind === 'lexical' || p.kind === 'motion') {
        const ref = p.refs[0];
        let g = firstSense(H.get(ref.root).glosses[ref.slot] || '?');
        if (p.suffixes.includes('-ti')) g = 'little ' + g;
        if (p.suffixes.includes('-ri')) g += 's';
        out.push(g);
      } else out.push(firstSense(glossFor(p)) || w);
    }
    return out.join(' ');
  }

  /* ================================================== the assisted composer

     Not a translator. It looks each English chunk up in the index built from
     the lexicon's own glosses and synonyms, offers every candidate it finds,
     and assembles the chosen ones in clause-template order. Anything it cannot
     find is reported as a gap, never guessed at. */

  const PRONOUN_EN = {
    i: 'maivo',
    me: 'maivo',
    my: 'maivo',
    mine: 'maivo',
    you: 'taivo',
    your: 'taivo',
    yours: 'taivo',
    he: 'saivo',
    him: 'saivo',
    his: 'saivo',
    she: 'saivo',
    her: 'saivo',
    hers: 'saivo',
    it: 'ito',
    its: 'ito',
    we: 'maivori',
    us: 'maivori',
    our: 'maivori',
    they: 'saivori',
    them: 'saivori',
    their: 'saivori',
  };
  const POSSESSIVE = new Set(['my', 'your', 'his', 'her', 'its', 'our', 'their']);

  /* English grammar markers → the particle and the slot it belongs in. Each
     marker becomes a row of its own in the breakdown, so nothing the grammar
     adds is hidden. `verb` marks an English verb ("began") that stands in for
     a real verb when its clause has no other. */
  const MARKERS = [
    { en: ['will', 'shall'], word: 'futu', slot: 'TENSE' },
    // "was" and "were" are po plus a copula; composeClause adds both.
    { en: ['did', 'had', 'ago'], word: 'po', slot: 'TENSE' },
    { en: ['can', 'could', 'able to'], word: 'povi', slot: 'MODAL' },
    { en: ['might', 'maybe', 'possibly'], word: 'nosi', slot: 'MODAL' },
    { en: ['may', 'allowed to', 'permitted'], word: 'dagi', slot: 'MODAL' },
    { en: ['must', 'have to', 'has to', 'need to'], word: 'musi', slot: 'MODAL' },
    { en: ['should'], word: 'suvi', slot: 'MODAL' },
    { en: ['hope to', 'hopes to', 'hoped to'], word: 'kopi', slot: 'MODAL' },
    { en: ['would'], word: 'viki', slot: 'MODAL' },
    { en: ['almost', 'nearly'], word: 'tavki', slot: 'APPROACH' },
    { en: ['about to'], word: 'fututi', slot: 'APPROACH' },
    {

      word: 'hiro',
      slot: 'PHASE',
    },
    {
      en: ['began', 'begin', 'begins', 'started', 'start'],
      word: 'hiro',
      slot: 'PHASE',
      verb: true,
    },
    { en: ['stopped', 'stop', 'ceased'], word: 'teki', slot: 'PHASE', verb: true },
    { en: ['tried to', 'try to', 'tries to'], word: 'telvo', slot: 'EFFORT' },
    { en: ['managed to', 'succeeded'], word: 'vazdi', slot: 'EFFORT' },
    { en: ['again'], word: 'reve', slot: 'ITERATION' },
    { en: ['still', 'keeps', 'keep on'], word: 'loki', slot: 'ITERATION' },
    { en: ['already'], word: 'bodu', slot: 'ITERATION' },
    { en: ['suddenly'], word: 'zafra', slot: 'FRAME' },
    { en: ['finally', 'at last'], word: 'finra', slot: 'FRAME' },
    { en: ['eventually'], word: 'lanto', slot: 'FRAME' },
    { en: ['at once', 'immediately'], word: 'kenvi', slot: 'FRAME' },
    { en: ['certainly', 'surely', 'indeed'], word: 'seye', slot: 'ATTITUDE' },

    { en: ['even'], word: 'yesta', slot: 'SCOPE' },
  ].map((m) => ({ ...m, phrases: m.en.map((p) => p.split(' ')) }));

  /* Negative words → ne, plus the marker a contraction carries with it:
     "can't" is povi and ne, "didn't" is po and ne. */
  const NEGATIVE = {
    not: null,
    never: null,
    no: null,
    "don't": null,
    "doesn't": null,
    cannot: 'can',
    "can't": 'can',
    "couldn't": 'could',
    "didn't": 'did',
    "won't": 'will',
    "wouldn't": 'would',
    "shouldn't": 'should',

  /* English words that open a new clause, as the checker's clause reset does
     for their Liraasa equivalents. "that" opens one only when a subject
     follows it ("I know that you sing"), not as a determiner ("that song"). */
  const CLAUSE_OPENERS = new Set([
    'when',
    'because',
    'if',
    'who',
    'which',
    'and',
    'but',
    'that+rel',
    'that+obj',

    'to+verb',

  /* Openers whose clause has no subject of its own: the relative's head noun,
     or the main clause's subject, fills it. */
  const NO_SUBJECT = new Set(['who', 'which', 'that+rel', 'to+verb']);
  /* Tokens rewriteEnglish coins, shown as the English the writer typed. */
  const DISPLAY = {
    'that+rel': 'that',
    'that+obj': 'that',
    'that+dem': 'that',
    'for+to': 'for … to',
    'to+verb': 'to',
  };

  /* Words carried by Liraasa grammar rather than by a dictionary entry. */
  const STRUCTURAL = {
    the: 'li',
    a: 'baba',
    an: 'baba',
    of: 'de',
    in: 'en',
    inside: 'en',
    to: 'ala',

    'that+rel': 'raho',

    'that+dem': 'ola',

    'to+verb': 'sidu',
    who: 'raho',

    every: 'toda',

    this: 'eli',

    why: 'ki-kasa',

    who_q: 'ki-nela',
  };

  /* English "to be" is a copula in Liraasa, not a word to drop. `ke` is the
     temporary state, `ka` the enduring one; both are offered. */
  const COPULA_EN = {
    is: 'ke',
    are: 'ke',
    am: 'ke',
    be: 'ke',
    being: 'ke',
    was: 'ke',
    were: 'ke',
    been: 'ke',

  const COPULA_ALTS = ['ke', 'ka', 'kapoki', 'loya', 'miyo'];

  /* Irregular pasts and participles, so "came" can find venreva. */
  const IRREGULAR = {
    came: 'come',
    went: 'go',
    gone: 'go',
    done: 'do',
    saw: 'see',
    seen: 'see',
    sang: 'sing',

  const STOPWORDS = new Set(['do', 'does', 'own']);

  /* Simple pasts, as opposed to participles. Seeing one means the clause is
     past, so it takes `po` — the author's corpus writes "Toda-nela po venreva
     sabri Dorin", not "Toda-nela venreva". */
  const IRREGULAR_PAST = new Set([
    'came',
    'went',
    'saw',
    'sang',
    'began',
    'had',
    'said',
    'made',
    'took',
    'gave',
    'knew',
    'felt',
    'told',
    'left',

    'stood',
    'understood',
    'wrote',
    'ate',
    'fell',
    'ran',
    'sat',
