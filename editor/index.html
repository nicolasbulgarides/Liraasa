<meta charset="utf-8" />
<title>Liraasa Songbook</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
/>

<style>
  /* ============================================================== tokens
     A composer's manuscript book: ledger paper with a red margin rule, written
     in blue-black ink. The red is a hairline only — it marks the margin, it is
     never a fill — and the gold appears on exactly one thing, the stressed
     syllable, because that is the mark a singer is looking for. */
  :root {
    color-scheme: light dark;

    --paper: #eceadf;
    --page: #fbfaf6;
    --raised: #f6f4ec;
    --ink: #1c2026;
    --ink-soft: #595f68;
    --ink-faint: #8a8f98;
    --rule: #dad7cb;
    --rule-firm: #bbb6a6;
    --margin: #b0564f;
    --accent: #2f4858;
    --accent-soft: #e2e9ee;
    --accent-ink: #ffffff;
    --gold: #8a6a1f;
    --gold-soft: #f2ead5;

    --error: #a3302f;
    --error-soft: #f8e8e6;
    --warn: #7e5a12;
    --warn-soft: #f6eedb;
    --note: #2b5d8a;
    --note-soft: #e3edf6;
    --unsettled: #6b7079;
    --unsettled-soft: #ececea;
    --ok: #2d5f4a;
    --ok-soft: #e4eee8;

    --ui: 'Work Sans', ui-sans-serif, system-ui, sans-serif;
    --lira: 'EB Garamond', 'Iowan Old Style', Palatino, Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace;

    --s1: 0.25rem;
    --s2: 0.5rem;
    --s3: 0.75rem;
    --s4: 1rem;
    --s5: 1.5rem;
    --s6: 2.25rem;
    --r: 4px;
    --rail: 232px;
    --insp: 400px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --paper: #121419;
      --page: #1a1d23;
      --raised: #22262d;
      --ink: #e7e5de;
      --ink-soft: #a0a5ae;
      --ink-faint: #767c86;
      --rule: #2b2f37;
      --rule-firm: #434852;
      --margin: #94514c;
      --accent: #93b6cb;
      --accent-soft: #1e2831;
      --accent-ink: #12151a;
      --gold: #cfae68;
      --gold-soft: #2a2417;

      --error: #ef9a96;
      --error-soft: #2d1b1a;
      --warn: #dcb871;
      --warn-soft: #2a2214;
      --note: #8db8e0;
      --note-soft: #18232e;
      --unsettled: #a3a7ae;
      --unsettled-soft: #24262a;
      --ok: #85c3a5;
      --ok-soft: #16251f;
    }
  }

  :root[data-theme='dark'] {
    --paper: #121419;
    --page: #1a1d23;
    --raised: #22262d;
    --ink: #e7e5de;
    --ink-soft: #a0a5ae;
    --ink-faint: #767c86;
    --rule: #2b2f37;
    --rule-firm: #434852;
    --margin: #94514c;
    --accent: #93b6cb;
    --accent-soft: #1e2831;
    --accent-ink: #12151a;
    --gold: #cfae68;
    --gold-soft: #2a2417;

    --error: #ef9a96;
    --error-soft: #2d1b1a;
    --warn: #dcb871;
    --warn-soft: #2a2214;
    --note: #8db8e0;
    --note-soft: #18232e;
    --unsettled: #a3a7ae;
    --unsettled-soft: #24262a;
    --ok: #85c3a5;
    --ok-soft: #16251f;
  }

  /* ================================================================ base */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  button,
  select,
  input,
  textarea {
    font: inherit;
    color: inherit;
  }

  .mono {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .btn {
    background: transparent;
    border: 1px solid var(--rule-firm);
    border-radius: var(--r);
    padding: 4px 9px;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 12px;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 500;
  }

  .btn-primary:hover {
    color: var(--accent-ink);
    opacity: 0.9;
  }

  .btn-quiet {
    border-color: transparent;
  }

  select {
    background: transparent;
    border: 1px solid var(--rule-firm);
    border-radius: var(--r);
    padding: 3px 6px;
    font-size: 12px;
    cursor: pointer;
  }

  /* =============================================================== shell */
  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100%;
    min-height: 0;
  }

  .masthead {
    display: flex;
    align-items: center;
    gap: var(--s3);
    padding: var(--s2) var(--s4);
    padding-top: calc(var(--s2) + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--rule);
    background: var(--raised);
    flex-wrap: wrap;
  }

  .masthead h1 {
    margin: 0;
    font-family: var(--lira);
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .masthead .ed {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 0 4px;
  }

  .spacer {
    margin-left: auto;
  }

  .desk {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr) var(--insp);
    min-height: 0;
    overflow: hidden;
  }

  .desk[data-rail='off'] {
    grid-template-columns: 0 minmax(0, 1fr) var(--insp);
  }

  .desk[data-insp='off'] {
    grid-template-columns: var(--rail) minmax(0, 1fr) 0;
  }

  .desk[data-rail='off'][data-insp='off'] {
    grid-template-columns: 0 minmax(0, 1fr) 0;
  }

  .col {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }

  .col.hidden {
    display: none;
  }

  /* ============================================================= library */
  .rail {
    background: var(--raised);
    border-right: 1px solid var(--rule);
  }

  .rail-head {
    display: flex;
    align-items: center;
    gap: var(--s2);
    padding: var(--s3) var(--s3) var(--s2);
    position: sticky;
    top: 0;
    background: var(--raised);
    border-bottom: 1px solid var(--rule);
    z-index: 1;
  }

  .coll {
    border-bottom: 1px solid var(--rule);
  }

  .coll-head {
    display: flex;
    align-items: center;
    gap: var(--s2);
    padding: var(--s2) var(--s3);
  }

  .coll-name {
    font-family: var(--lira);
    font-size: 1rem;
    font-weight: 600;
    background: transparent;
    border: none;
    padding: 1px 2px;
    border-radius: 3px;
    flex: 1;
    min-width: 0;
  }

  .coll-name:hover {
    background: var(--accent-soft);
  }

  .coll-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
  }

  .piece {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: var(--s2);
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-left: 2px solid transparent;
    padding: 5px var(--s3) 5px calc(var(--s3) + 10px);
    cursor: pointer;
    color: var(--ink-soft);
  }

  .piece:hover {
    background: var(--accent-soft);
  }

  .piece[aria-current='true'] {
    border-left-color: var(--margin);
    background: var(--page);
    color: var(--ink);
  }

  .piece .t {
    font-family: var(--lira);
    font-size: 0.98rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .piece .m {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .rail-foot {
    padding: var(--s3);
    display: flex;
    gap: var(--s2);
    flex-wrap: wrap;
  }

  /* ================================================================ page */
  .pagewrap {
    padding: var(--s5) var(--s4) var(--s6);
    display: flex;
    justify-content: center;
  }

  .page {
    background: var(--page);
    border: 1px solid var(--rule);
    border-radius: 2px;
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
    width: 100%;
    max-width: 44rem;
    min-height: 100%;
  }

  .page-head {
    padding: var(--s5) var(--s5) var(--s3);
    border-bottom: 1px solid var(--rule);
  }

  #title {
    font-family: var(--lira);
    font-size: 1.75rem;
    font-weight: 600;
    width: 100%;
    background: transparent;
    border: none;
    padding: 0;
    line-height: 1.2;
  }

  #title:focus {
    outline: none;
  }

  .page-meta {
    display: flex;
    gap: var(--s3);
    align-items: center;
    flex-wrap: wrap;
    margin-top: var(--s2);
  }

  /* The writing surface: a red margin rule, as on ledger paper, and the
     gutter counts sitting outside it. */
  .sheet {
    display: grid;
    grid-template-columns: 4.3rem 1fr;
    align-items: start;
  }

  .gutter {
    display: grid;
    border-right: 1px solid var(--margin);
    padding: var(--s5) 0 var(--s6);
  }

  .grow {
    --lh: 1.95rem;
    display: flex;
    align-items: flex-start;
    padding-top: calc((var(--lh) - 14px) / 2);
    justify-content: flex-end;
    gap: 5px;
    padding-right: 9px;
    height: 1.95rem;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .grow > span:first-child {
    line-height: 14px;
  }
  .grow .dot {
    margin-top: 4.5px;
  }

  .grow.err {
    color: var(--error);
  }
  .grow.wrn {
    color: var(--warn);
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex: none;
    background: transparent;
  }
  .dot.ok {
    background: var(--rule-firm);
  }
  .dot.wrn {
    background: var(--warn);
  }
  .dot.err {
    background: var(--error);
  }

  #text {
    font-family: var(--lira);
    font-size: 1.22rem;
    line-height: 1.95rem;
    width: 100%;
    border: none;
    background: transparent;
    padding: var(--s5) var(--s5) var(--s6) var(--s4);
    resize: none;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  #text:focus {
    outline: none;
  }

  /* Compose mode: the English under each line. The textarea cannot hold
     anything between its lines, so line spacing doubles and a layer that
     takes no pointer events draws the English in the gap, row for row, the
     way the gutter draws the syllable counts. Lines do not wrap here, or the
     rows would drift. */
  .page-body {
    position: relative;
    min-width: 0;
  }

  .interlinear {
    display: none;
    position: absolute;
    inset: 0;
    padding: var(--s5) var(--s5) var(--s6) var(--s4);
    overflow: hidden;
    pointer-events: none;
  }

  .il-row {
    height: 4.3rem;
    padding-top: 3.15rem;
    font-size: 12.5px;
    line-height: 1.1rem;
    color: var(--ink-soft);
    white-space: pre;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  body.interlinear-on .interlinear {
    display: block;
  }

  body.interlinear-on #text {
    line-height: 4.3rem;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
  }

  body.interlinear-on .grow {
    height: 4.3rem;
    --lh: 4.3rem;
  }

  /* ------------------------------------------------------ grammar marks
     The textarea cannot style its own text, so a backdrop behind it holds the
     same text, laid out identically and transparent, with each diagnostic's
     words wrapped in a mark. Each severity has its own underline style as
     well as its own colour, so nothing is told by colour alone. */
  .marks {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .marks-inner {
    padding: var(--s5) var(--s5) var(--s6) var(--s4);
    font-family: var(--lira);
    font-size: 1.22rem;
    line-height: 1.95rem;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    color: transparent;
  }
  #text {
    position: relative;
    z-index: 1;
  }
  .marks-inner .ml {
    min-height: 1lh;
  }
  .marks mark {
    color: transparent;
    background: none;
    text-decoration-line: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
  }
  .marks mark.error {
    text-decoration-style: wavy;
    text-decoration-color: var(--error);
  }
  .marks mark.warn {
    text-decoration-style: wavy;
    text-decoration-color: var(--warn);
  }
  .marks mark.note {
    text-decoration-style: dotted;
    text-decoration-color: var(--note);
  }
  .marks mark.unsettled {
    text-decoration-style: dashed;
    text-decoration-color: var(--unsettled);
  }
  body.interlinear-on .marks-inner {
    line-height: 4.3rem;
    white-space: pre;
    overflow-wrap: normal;
  }

  /* Literal gloss: the back-translation under each line, below any English. */
  body.gloss-on .interlinear {
    display: block;
  }
  body.gloss-on #text {
    line-height: 6.2rem;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
  }
  body.gloss-on .marks-inner {
    line-height: 6.2rem;
    white-space: pre;
    overflow-wrap: normal;
  }
  body.gloss-on .grow {
    height: 6.2rem;
    --lh: 6.2rem;
  }
  body.gloss-on .il-row {
    height: 6.2rem;
    padding-top: 4.2rem;
    line-height: 1rem;
  }
  .il-gl {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--note);
  }

  .diag-tip {
    position: fixed;
    z-index: 20;
    max-width: 26rem;
    padding: var(--s2) var(--s3);
    background: var(--raised);
    border: 1px solid var(--rule-firm);
    border-left: 3px solid var(--rule-firm);
    border-radius: var(--r);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    font-size: 12.5px;
    line-height: 1.45;
    pointer-events: none;
  }
  .diag-tip .tip-item + .tip-item {
    margin-top: var(--s2);
    padding-top: var(--s2);
    border-top: 1px solid var(--rule);
  }
  .diag-tip.error {
    border-left-color: var(--error);
  }
  .diag-tip.warn {
    border-left-color: var(--warn);
  }
  .diag-tip.note {
    border-left-color: var(--note);
  }
  .sev {
    display: inline-block;
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0 4px;
    border-radius: 3px;
    margin-right: 4px;
  }
  .sev.error {
    color: var(--error);
    background: var(--error-soft);
  }
  .sev.warn {
    color: var(--warn);
    background: var(--warn-soft);
  }
  .sev.note {
    color: var(--note);
    background: var(--note-soft);
  }
  .sev.unsettled {
    color: var(--unsettled);
    background: var(--unsettled-soft);
  }
  .tip-fix,
  .finding .fix {
    color: var(--ink-soft);
    font-size: 12px;
  }
  .tip-fix .liraasa,
  .finding .fix .liraasa,
  .finding .tok {
    font-family: var(--lira);
    font-size: 14px;
    color: var(--ink);
  }

  .gfix {
    border: 1px solid var(--rule-firm);
    background: var(--page);
    color: var(--ink-soft);
    font: 600 9px var(--mono);
    border-radius: 3px;
    padding: 0 3px;
    line-height: 14px;
    cursor: pointer;
  }
  .gfix:hover,
  .gfix:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* =========================================================== inspector */
  .insp {
    border-left: 1px solid var(--rule);
    background: var(--raised);
  }

  .insp-head {
    position: sticky;
    top: 0;
    background: var(--raised);
    border-bottom: 1px solid var(--rule);
    z-index: 1;
  }

  .tabs {
    display: flex;
    overflow-x: auto;
  }

  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 10px;
    cursor: pointer;
    color: var(--ink-faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tab[aria-selected='true'] {
    color: var(--ink);
    border-bottom-color: var(--margin);
  }

  .panel {
    padding: var(--s4);
    overflow-x: hidden;
  }

  .panel table {
    max-width: 100%;
  }

  .empty {
    color: var(--ink-faint);
    font-style: italic;
  }

  /* ---------------------------------------------------------- findings */
  .finding {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: var(--s3);
    padding: var(--s2) var(--s3);
    border-left: 2px solid var(--rule-firm);
    background: var(--page);
    margin-bottom: var(--s2);
  }

  .finding.error {
    border-left-color: var(--error);
    background: var(--error-soft);
  }
  .finding.warn {
    border-left-color: var(--warn);
    background: var(--warn-soft);
  }
  .finding.note {
    border-left-color: var(--note);
    background: var(--note-soft);
  }
  .finding.unsettled {
    border-left-color: var(--unsettled);
    background: var(--unsettled-soft);
  }
  .finding .body {
    display: grid;
    gap: 2px;
  }
  .diag-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s2);
    margin: var(--s3) 0 var(--s1);
  }
  .diag-tools {
    display: flex;
    align-items: center;
    gap: var(--s2);
    margin-bottom: var(--s3);
    font-size: 12px;
  }

  .finding .where {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .finding .rule {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--ink-faint);
  }

  /* ------------------------------------------------------------- table */
  .tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .tbl th,
  .tbl td {
    text-align: left;
    padding: 4px 6px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
  }

  .tbl th {
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
  }

  .tbl .n {
    font-family: var(--mono);
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .tbl .lira {
    font-family: var(--lira);
    font-size: 1rem;
  }

  .shape {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 1px;
    overflow-wrap: anywhere;
  }

  .tbl.lines {
    table-layout: fixed;
  }

  .tbl.lines td:first-child,
  .tbl.lines th:first-child {
    width: 2.2rem;
  }

  .tbl.lines td:nth-child(2),
  .tbl.lines th:nth-child(2) {
    width: 1.2rem;
  }

  .tbl.lines td:nth-child(3),
  .tbl.lines th:nth-child(3) {
    width: 2.6rem;
  }

  .shape b {
    color: var(--gold);
  }

  /* ------------------------------------------------------------- gloss */
  .gl {
    margin-bottom: var(--s4);
    padding-bottom: var(--s3);
    border-bottom: 1px solid var(--rule);
  }

  .gl:last-child {
    border-bottom: none;
  }

  .gl-no {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--ink-faint);
